  }
  function submitQuiz(){if(!quiz)return;const unanswered=quiz.answers.filter(x=>x===null).length;if(unanswered){if(!confirm(`Bạn còn ${unanswered} câu chưa trả lời. Vẫn nộp bài?`))return;}
    let score=0;quiz.forEach((q,i)=>{const ok=quiz.answers[i]===q.a;if(ok)score++;const a=state.attempts[q.topic]||{total:0,correct:0};a.total++;if(ok)a.correct++;state.attempts[q.topic]=a;});
    const elapsed=Math.max(1,Math.round((Date.now()-quizStartedAt)/60000));const pct=Math.round(score/quiz.length*100);const hist={date:new Date().toLocaleString('vi-VN'),label:$('#quizTopic').selectedOptions[0]?.textContent||'Luyện tập tổng hợp',score,total:quiz.length,pct};state.history.push(hist);state.history=state.history.slice(-30);saveState();
    $('#quizArea').classList.add('hidden');$('#quizResult').classList.remove('hidden');$('#resultSub').textContent=`Hoàn thành ${quiz.length} câu hỏi · ${hist.date}`;$('#resultScore').textContent=`${score}/${quiz.length}`;$('#resultPercent').textContent=pct+'%';$('#resultRing').style.setProperty('--score',pct+'%');$('#resultCorrect').textContent=score;$('#resultWrong').textContent=quiz.length-score;$('#resultDuration').textContent=elapsed+' phút';$('#resultMessage').textContent=pct>=90?'Rất tốt! Bạn đã nắm chắc các câu hỏi trong lượt luyện này. Hãy thử mức độ cao hơn hoặc giải thích lại cách làm bằng lời của mình.':pct>=70?'Bạn đang đi đúng hướng. Hãy xem lại các câu sai và luyện thêm dạng tương tự.':'Đừng vội nản. Hãy đọc lời giải từng câu, quay lại thư viện học phương pháp rồi thử lại.';
    $('#reviewList').innerHTML=quiz.map((q,i)=>{const ok=quiz.answers[i]===q.a;const t=topicById(q.topic);return `<div class="panel" style="padding:13px"><div style="display:flex;justify-content:space-between;gap:10px"><b style="font-size:10px">Câu ${i+1}. ${safe(q.q)}</b><span class="pill ${ok?'green':'amber'}">${ok?'Đúng':'Cần ôn lại'}</span></div><p style="font-size:9px;color:var(--muted)">Bạn chọn: ${quiz.answers[i]===null?'Chưa trả lời':safe(q.o[quiz.answers[i]])} · Đáp án: <b style="color:var(--mint)">${safe(q.o[q.a])}</b></p><div class="hint-card"><strong>${safe(t?.title||'Giải thích')}</strong><p>${safe(q.e)}</p></div></div>`;}).join('');
    renderHome();renderProgress();
  }

  function parsePoly(expr){
    let s=expr.replace(/\s+/g,'').replace(/−/g,'-').replace(/²/g,'^2').replace(/×/g,'*').toLowerCase();
    if(!s)return null;if(s[0]!=='+'&&s[0]!=='-')s='+'+s;
    const terms=s.match(/[+-][^+-]+/g);if(!terms)return null;const c=[0,0,0];
    for(let term of terms){
      const variable=term.includes('x');let sign=term[0]==='-'?-1:1;let body=term.slice(1);
      if(variable){const m=body.match(/^(?:(\d+(?:\.\d*)?|\.\d+)\*?)?x(?:\^(\d+))?$/);if(!m)return null;const coef=m[1]===undefined?1:Number(m[1]);const power=m[2]===undefined?1:Number(m[2]);if(power>2)return null;c[power]+=sign*coef;}
      else {if(!/^(\d+(?:\.\d*)?|\.\d+)$/.test(body))return null;c[0]+=sign*Number(body);}
    }
    return c;
  }
  function solveSimpleEquation(raw){
    const normalized=raw.replace(/²/g,'^2').replace(/−/g,'-').replace(/×/g,'*');
    const match=normalized.match(/([0-9xX+\-^*.()\s]+=[0-9xX+\-^*.()\s]+)/);if(!match)return null;
    const [left,right]=match[0].split('=');const p=parsePoly(left),q=parsePoly(right);if(!p||!q)return null;const c=p.map((v,i)=>v-q[i]);const [C,B,A]=c;const eps=1e-9;
    if(Math.abs(A)<eps&&Math.abs(B)<eps)return {text:Math.abs(C)<eps?'Đẳng thức đúng với mọi x (phương trình có vô số nghiệm).':'Phương trình vô nghiệm.',steps:[`Chuyển tất cả về một vế: ${c[0]} = 0.`]};
    if(Math.abs(A)<eps){const x=-C/B;return {text:`Nghiệm: x = ${fmt(x)}.`,steps:[`Rút gọn về phương trình bậc nhất ${fmt(B)}x ${C>=0?'+':''}${fmt(C)} = 0.`,`Chuyển vế và chia hệ số: x = −(${fmt(C)})/${fmt(B)} = ${fmt(x)}.`]};}
    const D=B*B-4*A*C;if(D< -eps)return {text:'Phương trình vô nghiệm trong ℝ (Δ < 0).',steps:[`a=${fmt(A)}, b=${fmt(B)}, c=${fmt(C)}.`,`Δ=b²−4ac=${fmt(D)}<0 nên phương trình không có nghiệm thực.`]};
    if(Math.abs(D)<eps){const x=-B/(2*A);return {text:`Nghiệm kép x = ${fmt(x)}.`,steps:[`a=${fmt(A)}, b=${fmt(B)}, c=${fmt(C)}.`,`Δ=0 nên x=−b/(2a)=${fmt(x)}.`]};}
    const x1=(-B-Math.sqrt(D))/(2*A),x2=(-B+Math.sqrt(D))/(2*A);return {text:`Hai nghiệm: x₁ = ${fmt(x1)}, x₂ = ${fmt(x2)}.`,steps:[`Đưa về ${fmt(A)}x² ${B>=0?'+':''}${fmt(B)}x ${C>=0?'+':''}${fmt(C)} = 0.`,`Δ=b²−4ac=${fmt(D)}>0.`,`Áp dụng x=(-b±√Δ)/(2a), thu được hai nghiệm trên.`]};
  }
  function fmt(n){if(Math.abs(n-Math.round(n))<1e-9)return String(Math.round(n));return Number(n.toFixed(4)).toString();}
  function tutorAnswer(text){
    const solved=solveSimpleEquation(text);if(solved)return `Mình nhận diện được phương trình và sẽ giải theo các bước:
${solved.steps.map((s,i)=>`${i+1}. ${s}`).join('\n')}

${solved.text}

Bạn hãy thử thay nghiệm vào phương trình ban đầu để kiểm tra lại nhé.`;
    const words=text.toLowerCase().normalize('NFC');let best=null,bestScore=0;
    topics.forEach(t=>t.types.forEach((f,i)=>{const keys=[f.name,t.title,...f.name.toLowerCase().split(/\s+/).filter(w=>w.length>3)];let score=0;keys.forEach(k=>{const kk=k.toLowerCase();if(kk.length>2&&words.includes(kk))score+=kk===f.name.toLowerCase()?5:1;});if(score>bestScore){bestScore=score;best={t,f,i};}}));
    if(best&&bestScore>0){const {t,f,i}=best;return `Mình nghĩ câu hỏi của bạn liên quan đến dạng “${f.name}” trong chuyên đề ${t.title}.

Dấu hiệu nhận biết: ${f.recognize}

Cách làm gợi ý:
${f.method.map((s,i)=>`${i+1}. ${s}`).join('\n')}

Ví dụ trong thư viện: ${f.example}
Kết luận mẫu: ${f.result}

Lỗi cần tránh: ${f.mistakes}

Bạn có thể mở “${f.name}” trong Thư viện dạng toán để xem lời giải từng bước đầy đủ hơn.`;}
    return 'Mình chưa nhận diện chính xác dạng bài từ câu hỏi này. Bạn thử gửi theo một trong các cách sau nhé:\n• Gõ phương trình dạng x^2-5x+6=0.\n• Nêu tên dạng: “tìm đỉnh parabol”, “tính trung vị”, “viết phương trình đường tròn”.\n• Gửi yêu cầu rõ hơn: “Hướng dẫn từng bước cách giải bất phương trình bậc hai”.\n\nĐây là bản demo chạy cục bộ nên chưa hiểu ngôn ngữ tự do như một mô hình AI trực tuyến.';
  }
  function addBubble(text,type){const b=document.createElement('div');b.className=`bubble ${type}`;b.textContent=text;$('#chatMessages').appendChild(b);$('#chatMessages').scrollTop=$('#chatMessages').scrollHeight;}
  function sendTutor(){if(window.AIMentorTutor){window.AIMentorTutor.send();return;}const input=$('#tutorInput');const text=input.value.trim();if(!text)return;addBubble(text,'user');input.value='';setTimeout(()=>addBubble(tutorAnswer(text),'bot'),150);}

  function exportData(){const payload={app:'AI Mentor Toán 10 Ultimate',version:1,exportedAt:new Date().toISOString(),progress:state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ai-mentor-toan10-progress.json';a.click();URL.revokeObjectURL(a.href);toast('Đã tạo tệp sao lưu JSON.');}
  function bindEvents(){
    document.addEventListener('click',e=>{
      const page=e.target.closest('[data-page]');if(page){goPage(page.dataset.page);return;}
      const topic=e.target.closest('[data-topic]');if(topic){selectedTopic=topic.dataset.topic;goPage('library');renderLibrary();return;}
      const form=e.target.closest('[data-form-topic]');if(form){openForm(form.dataset.formTopic,Number(form.dataset.formIndex));return;}
      const prompt=e.target.closest('[data-prompt]');if(prompt){goPage('tutor');$('#tutorInput').value=prompt.dataset.prompt;sendTutor();return;}
      const answer=e.target.closest('[data-answer]');if(answer&&quiz){quiz.answers[quiz.index]=Number(answer.dataset.answer);renderQuestion();return;}
      const jump=e.target.closest('[data-jump]');if(jump&&quiz){quiz.index=Number(jump.dataset.jump);renderQuestion();return;}
      const action=e.target.closest('[data-action]');if(action&&action.dataset.action==='start-quick'){goPage('practice');startQuiz();return;}
      if(e.target.id==='backToTopics'){selectedTopic=null;renderLibrary();return;}
    });
    $('#modalClose').addEventListener('click',closeModal);$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal();});
    $('#modalBody').addEventListener('click',e=>{if(e.target.id==='markDoneBtn')markFormDone();if(e.target.id==='saveFormBtn')toggleSaved();if(e.target.id==='practiceRelatedBtn'&&currentForm){$('#quizTopic').value=currentForm.tid;closeModal();goPage('practice');startQuiz();}});
    $('#librarySearch').addEventListener('input',()=>{selectedTopic=null;renderLibrary();});$('#groupFilter').addEventListener('change',()=>{selectedTopic=null;renderLibrary();});$('#levelFilter').addEventListener('change',()=>{selectedTopic=null;renderLibrary();});
    $('#formulaSearch').addEventListener('input',renderFormulas);$('#formulaGroup').addEventListener('change',renderFormulas);
    $('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){goPage('library');$('#librarySearch').value=e.target.value;renderLibrary();}});
    $('#sendTutor').addEventListener('click',sendTutor);$('#tutorInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendTutor();}});
    $('#startQuiz').addEventListener('click',startQuiz);$('#prevQuestion').addEventListener('click',()=>{if(quiz&&quiz.index>0){quiz.index--;renderQuestion();}});$('#nextQuestion').addEventListener('click',()=>{if(quiz&&quiz.index<quiz.length-1){quiz.index++;renderQuestion();}});$('#submitQuiz').addEventListener('click',submitQuiz);$('#submitQuizSide').addEventListener('click',submitQuiz);
    $('#backQuizSetup').addEventListener('click',()=>{$('#quizResult').classList.add('hidden');$('#quizSetup').classList.remove('hidden');quiz=null;});
    $('#clearHistory').addEventListener('click',()=>{if(confirm('Xóa toàn bộ lịch sử luyện tập?')){state.history=[];state.attempts={};saveState();renderProgress();renderHome();toast('Đã xóa lịch sử.');}});
    $('#resetProgress').addEventListener('click',()=>{if(confirm('Đặt lại toàn bộ dữ liệu tiến độ, câu đã làm và dạng đã lưu?')){state=structuredClone(initial);saveState();renderProgress();renderHome();renderSavedTutor();toast('Đã đặt lại tiến độ.');}});
    $('#exportBtn').addEventListener('click',exportData);$('#exportProgress').addEventListener('click',exportData);
    $('#menuToggle').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
  }

  function init(){
    initSelectors();bindEvents();$('#formCount').textContent=totalForms;renderHome();renderLibrary();renderFormulas();renderProgress();renderSavedTutor();
  }
  init();
})();

</script>
<script>
/*
 * AI Mentor Toán 10 — Tutor Pro
 * Offline-first tutoring engine:
 * - retrieval over the local Mathematics 10 library
 * - safe polynomial parser (no eval)
 * - linear/quadratic equation and inequality support
 * - quadratic-function analysis
 * - Socratic hints, detailed explanations, answer checking, similar practice
 * - learner profile, notes, chat sessions and optional secure API-proxy hook
 *
 * This is not a general-purpose LLM. A real online model must be connected
 * through a server-side proxy; never put provider API keys in browser code.
 */
(() => {
  'use strict';

  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
  const LIBRARY = window.MATH_LIBRARY || [];
  const BANK = window.QUESTION_BANK || [];
  const STORAGE_KEY = 'aiMentorTutorPro_v1';
  const MAX_MESSAGES = 70;
  const MAX_SESSIONS = 12;
  const STOP_WORDS = new Set(('va la cua cho mot cac nhung voi tu trong tren duoi ve hay giup em toi minh ban co the khong nhu the nao tai sao lam sao cach de bai toan giai tinh tim x y z phuong trinh').split(' '));

  const defaults = {
    mode: 'guide',
    profile: { goal: 'understand', selfLevel: 'average', level: 'auto', style: 'socratic', grade: 'auto' },
    proxyUrl: '', messages: [], sessions: [], notes: [],
    stats: { asked: 0, solved: 0, checked: 0, helpful: 0 }
  };

  let store = loadStore();
  let detected = null;
  let lastSolution = null;
  let pendingQuestion = null;
  let pendingStep = null;
  let busy = false;
  let selectedImageDataUrl = '';

  function loadStore() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      return {
        ...defaults, ...raw,
        profile: { ...defaults.profile, ...(raw.profile || {}) },
        messages: Array.isArray(raw.messages) ? raw.messages.slice(-MAX_MESSAGES) : [],
        sessions: Array.isArray(raw.sessions) ? raw.sessions.slice(-MAX_SESSIONS) : [],
        notes: Array.isArray(raw.notes) ? raw.notes : [],
        stats: { ...defaults.stats, ...(raw.stats || {}) }
      };
    } catch (_) { return structuredClone(defaults); }
  }
  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }
    catch (_) { setStatus('Không thể lưu bộ nhớ trình duyệt. Hãy xuất hội thoại để sao lưu.', true); }
  }
  function escapeHTML(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }
  function setStatus(text, warning = false) {
    const node = $('#tutorEngineStatus');
    if (node) { node.textContent = (warning ? '● ' : '● ') + text; node.style.color = warning ? 'var(--amber)' : 'var(--mint)'; }
  }
  function toastTutor(text) {
    const node = $('#toast');
    if (!node) return;
    node.textContent = text; node.classList.add('show');
    clearTimeout(toastTutor.timer); toastTutor.timer = setTimeout(() => node.classList.remove('show'), 2300);
  }
  function normalize(text) {
    return String(text || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/đ/g, 'd').replace(/−/g, '-').replace(/×/g, '*').replace(/·/g, '*')
      .replace(/²/g, '^2').replace(/³/g, '^3').replace(/≤/g, '<=').replace(/≥/g, '>=');
  }
  function tokens(text) {
    return normalize(text).split(/[^a-z0-9]+/).filter(w => w.length > 1 && !STOP_WORDS.has(w));
  }
  function formatNumber(n) {
    if (!Number.isFinite(n)) return String(n);
    if (Math.abs(n) < 1e-10) n = 0;
    return Number(n.toFixed(5)).toString().replace('.', ',');
  }
  function topicById(id) { return LIBRARY.find(t => t.id === id); }

  // ── Retrieval: find the closest authored form in the local knowledge base ──
  function scoreText(queryTokens, text) {
    const set = new Set(tokens(text));
    let score = 0;
    queryTokens.forEach(token => { if (set.has(token)) score += token.length > 6 ? 2 : 1; });
    return score;
  }
  function findBestForm(query, forcedTopic = 'all') {
    const qn = normalize(query);
    const qTokens = tokens(query);
    let best = null;
    for (const topic of LIBRARY) {
      if (forcedTopic !== 'all' && topic.id !== forcedTopic) continue;
      topic.types.forEach((form, index) => {
        const title = normalize(form.name);
        const joined = [topic.title, topic.description, form.name, form.recognize, form.formula, ...(form.method || [])].join(' ');
        let score = scoreText(qTokens, joined);
        if (title.length > 5 && qn.includes(title)) score += 12;
        const topicTitle = normalize(topic.title);
        if (topicTitle.length > 5 && qn.includes(topicTitle)) score += 5;
        // A form explicitly mentioned in a prompt should win over a broad topic match.
        const specific = normalize(form.name).split(' ').filter(w => w.length > 4);
        if (specific.length && specific.every(w => qn.includes(w))) score += 6;

    return `${feedback}\n\nCâu hỏi: ${q.q}\nBạn chọn: ${'ABCD'[chosen]}. ${q.o[chosen]}\nĐáp án: ${'ABCD'[q.a]}. ${q.o[q.a]}\n\nGiải thích: ${q.e}\n\n${topic ? `Chuyên đề ôn lại: ${topic.title}.` : ''} ${right ? 'Hãy thử câu tiếp theo để củng cố kiến thức.' : 'Bạn nên xem lại lý do của đáp án, sau đó thử lại một câu cùng dạng.'}`;
  }
  function verifyCandidate(text, solved) {
    const patterns = [...text.matchAll(/x\s*=\s*([+-]?\d+(?:[.,]\d+)?)/gi)].map(m => Number(m[1].replace(',', '.')));
    if (!patterns.length) return null;
    const expected = solved.roots || [];
    if (!expected.length) return `Phương trình không có nghiệm thực, nên mọi giá trị x bạn nêu đều không phải nghiệm.`;
    const same = patterns.length === expected.length && patterns.every(v => expected.some(r => Math.abs(v - r) < 1e-5));
    if (same) return `Mình đã kiểm tra: các nghiệm bạn nêu khớp với kết quả giải phương trình.\n\nNghiệm: ${expected.map(v => formatNumber(v)).join(' và ')}.\n\nBước tiếp theo: thay từng nghiệm vào phương trình gốc để xác nhận hai vế bằng nhau.`;
    const missed = expected.filter(r => !patterns.some(v => Math.abs(v - r) < 1e-5));
    const extra = patterns.filter(v => !expected.some(r => Math.abs(v - r) < 1e-5));
    return `Mình thấy kết quả của bạn chưa khớp hoàn toàn.\n\nNghiệm cần có: ${expected.map(v => formatNumber(v)).join(' và ')}.\n${missed.length ? `Bạn đang thiếu nghiệm: ${missed.map(formatNumber).join(', ')}.\n` : ''}${extra.length ? `Giá trị chưa thỏa phương trình: ${extra.map(formatNumber).join(', ')}.\n` : ''}\nHãy kiểm tra lại bước tính Δ hoặc bước thay vào công thức nghiệm.`;
  }
  function handlePendingStep(text) {
    if (!pendingStep || !['guide', 'hint'].includes(currentMode())) return null;
    const q = normalize(text).trim();
    if (/giai chi tiet|xem loi giai|bo qua|khong can goi y/.test(q)) { pendingStep = null; return null; }
    const words = q.match(/[a-z]+/g) || [];
    const allowedWords = new Set(['delta','em','tinh','duoc','ket','qua','la','bang','x','x1','x2','nghiem','va','voi','ra','dau']);
    const looksLikeNewQuestion = /giai|tim|xet|phan tich|viet|chung minh|bat phuong trinh|phuong trinh|parabol|ham so|dinh li|cho em|tiep tuc bai/.test(q) || words.some(word => !allowedWords.has(word));
    if (looksLikeNewQuestion) { pendingStep = null; return null; }
    const numbers = (q.match(/[+-]?\d+(?:[.,]\d+)?/g) || []).map(v => Number(v.replace(',', '.')));
    if (!numbers.length && /khong biet|chua biet|khong lam duoc/.test(q)) {
      if (pendingStep.kind === 'delta') {
        const [c, b, a] = pendingStep.result.coefficients;
        return `Không sao, mình gợi ý thêm nhé.\n\nΔ=b²−4ac. Với bài của bạn: a=${formatNumber(a)}, b=${formatNumber(b)}, c=${formatNumber(c)}.\n\nHãy tính lần lượt b², sau đó tính 4ac, cuối cùng lấy hiệu b²−4ac. Bạn thử gửi kết quả.`;
      }
      return `Ta làm chậm hơn nhé. Hãy viết công thức cần dùng trước, rồi thay số vào từng vị trí. Bạn gửi phép tính đang vướng, mình sẽ kiểm tra riêng bước đó.`;
    }
    if (!numbers.length) return null;
    const value = numbers[numbers.length - 1];
    if (pendingStep.kind === 'delta') {
      const expected = pendingStep.result.delta;
      if (Math.abs(value - expected) > 1e-5) {
        const [c, b, a] = pendingStep.result.coefficients;
        return `Kết quả Δ bạn gửi chưa khớp.\n\nTa có a=${formatNumber(a)}, b=${formatNumber(b)}, c=${formatNumber(c)}.\nΔ = (${formatNumber(b)})² − 4·${formatNumber(a)}·${formatNumber(c)}.\n\nBạn kiểm tra lại dấu của b và phép nhân 4ac rồi thử lại nhé.`;
      }
      if (!pendingStep.result.roots.length) {
        pendingStep = null;
        return `Đúng rồi, Δ=${formatNumber(expected)}<0. Vì vậy phương trình không có nghiệm thực.\n\nBạn vừa hoàn thành bước phân loại số nghiệm. Hãy ghi nhớ: Δ<0 ⇒ vô nghiệm trong ℝ.`;
      }
      pendingStep.kind = 'roots';
      const [c, b, a] = pendingStep.result.coefficients;
      return `Chính xác! Δ=${formatNumber(expected)}.\n\nBước tiếp theo là dùng công thức nghiệm:\nx₁ = (−b−√Δ)/(2a),   x₂ = (−b+√Δ)/(2a).\n\nVới a=${formatNumber(a)}, b=${formatNumber(b)}, bạn thử tính hai nghiệm rồi gửi kết quả theo dạng “x1=…; x2=…”.`;
    }
    if (pendingStep.kind === 'roots') {
      const expected = pendingStep.result.roots;
      const values = numbers.length >= expected.length ? numbers.slice(-expected.length) : numbers;
      const correct = values.length === expected.length && values.every(v => expected.some(r => Math.abs(v - r) < 1e-5));
      if (!correct) return `Hai nghiệm bạn gửi chưa khớp hoàn toàn.\n\nHãy thay Δ=${formatNumber(pendingStep.result.delta)} vào công thức nghiệm và nhớ chia toàn bộ tử số cho 2a. Bạn thử lại nhé.`;
      pendingStep = null;
      return `Rất tốt! Hai nghiệm bạn tính được là ${expected.map(formatNumber).join(' và ')}.\n\nBây giờ thay từng nghiệm vào phương trình ban đầu để kiểm tra. Nếu cả hai đều làm hai vế bằng nhau, lời giải đã hoàn tất.`;
    }
    if (pendingStep.kind === 'linear') {
      const expected = pendingStep.result.roots[0];
      if (Math.abs(value - expected) < 1e-5) {
        pendingStep = null;
        return `Đúng rồi, x=${formatNumber(expected)}. Hãy thay lại vào phương trình ban đầu để kiểm tra hai vế.`;
      }
      return 'Chưa đúng. Hãy chuyển hằng số sang vế phải trước, sau đó chia hai vế cho hệ số của x. Lưu ý dấu khi chuyển vế nhé.';
    }
    return null;
  }

  function explainConcept(text) {
    const q = normalize(text);
    if (/delta|biet thuc/.test(q) && /(tai sao|vi sao|y nghia|de lam gi|dung de lam gi|giai thich)/.test(q)) {
      return `Vì sao phải tính Δ trong phương trình bậc hai?\n\nVới ax²+bx+c=0 (a≠0), Δ=b²−4ac giúp ta biết phương trình có bao nhiêu nghiệm thực trước khi tính nghiệm:\n\n• Δ>0: có hai nghiệm phân biệt.\n• Δ=0: có một nghiệm kép.\n• Δ<0: không có nghiệm thực.\n\nĐiều này đặc biệt quan trọng khi xét dấu tam thức: nếu Δ>0, tam thức đổi dấu khi đi qua mỗi nghiệm đơn; nếu Δ=0, tam thức chạm 0 tại nghiệm kép nhưng không đổi dấu; nếu Δ<0, tam thức luôn cùng dấu với hệ số a.\n\nVí dụ: x²−5x+6 có Δ=25−24=1>0, nên có hai nghiệm 2 và 3. Từ đó ta lập được bảng xét dấu.\n\nBạn nhớ: Δ không phải là công thức để “tìm mọi thứ”; nó là bước phân loại số nghiệm và hỗ trợ xét dấu.`;
    }
    if (/(chia|nhan).*(so am|am)/.test(q) && /(bat dang thuc|doi chieu|dau)/.test(q)) {
      return `Khi nhân hoặc chia hai vế của bất đẳng thức cho một số âm, ta phải đổi chiều dấu.\n\nLý do: trên trục số, nhân với số âm làm thứ tự bị đảo. Ví dụ 2<5 nhưng nhân hai vế với −1 ta được −2>−5.\n\nMẹo nhớ: cộng/trừ cùng một số thì giữ chiều; nhân/chia với số dương thì giữ chiều; nhân/chia với số âm thì đổi chiều.`;
    }
    if (/(binh phuong|can|nghiem ngoai lai)/.test(q) && /(dieu kien|tai sao|vi sao|thu lai)/.test(q)) {
      return `Khi bình phương hai vế, cần kiểm tra điều kiện vì phép bình phương không luôn là phép biến đổi tương đương nếu chưa kiểm soát dấu.\n\nVí dụ √(x+1)=x−1: vế trái không âm nên bắt buộc x−1≥0, tức x≥1. Sau khi bình phương, có thể xuất hiện nghiệm của phương trình mới nhưng không thỏa điều kiện ban đầu. Vì vậy phải đối chiếu nghiệm với điều kiện và thử lại vào đề gốc.`;
    }
    if (/(tich vo huong)/.test(q) && /(vuong goc|bang 0|tai sao)/.test(q)) {
      return `Tích vô hướng liên hệ trực tiếp với góc giữa hai vectơ: u⃗·v⃗=|u⃗||v⃗|cosθ.\n\nNếu hai vectơ khác vectơ-không và vuông góc thì θ=90°, cos90°=0, do đó u⃗·v⃗=0. Ngược lại, nếu tích vô hướng bằng 0 và cả hai vectơ đều khác 0 thì cosθ=0 nên chúng vuông góc.`;
    }
    if (/(trung vi|tu phan vi)/.test(q) && /(tai sao|vi sao|cach|tinh)/.test(q)) {
      return `Muốn tìm trung vị hoặc tứ phân vị, trước hết phải sắp xếp dữ liệu theo thứ tự tăng dần. Những chỉ số này được xác định theo vị trí của dữ liệu trong dãy đã sắp xếp, không phải theo thứ tự xuất hiện ban đầu.\n\nQ₂ chính là trung vị của cả mẫu. Q₁ là trung vị của nửa dưới và Q₃ là trung vị của nửa trên theo quy ước tứ phân vị mà lớp đang sử dụng. Hãy kiểm tra quy ước của sách giáo khoa/giáo viên nếu số phần tử là lẻ.`;
    }
    return null;
  }

  function explainPrevious(text) {
    if (!store.messages.length) return null;
    const previous = [...store.messages].reverse().find(m => m.role === 'assistant');
    if (!previous) return null;
    const stepMatch = normalize(text).match(/buoc\s*(\d+)/);
    if (stepMatch) {
      const n = Number(stepMatch[1]);
      const lines = previous.text.split('\n').filter(line => /^(?:buoc|\d+\.)/i.test(normalize(line).trim()));
      const line = lines[n - 1];
      if (line) return `Bạn đang hỏi về bước ${n}:\n\n${line}\n\nÝ nghĩa: đây là thao tác biến đổi để đưa bài toán về dạng dễ áp dụng công thức hơn. Khi làm bước này, hãy kiểm tra dấu của từng hạng tử và giữ nguyên hai vế của đẳng thức.`;
    }
    if (/giai thich lai|noi ro hon|chua hieu|tai sao|vi sao/.test(normalize(text))) {
      return `Mình sẽ giải thích lại theo cách khác.\n\nỞ lời giải trước, ta cần tách rõ ba việc: (1) nhận diện dữ kiện, (2) chọn công thức phù hợp, (3) kiểm tra điều kiện và kết quả.\n\nBạn nói rõ phần nào chưa hiểu — công thức, phép biến đổi hay kết luận — để mình tập trung đúng chỗ nhé.`;
    }
    return null;
  }
  function localTutor(text) {
    const mode = currentMode();
    const pending = checkPendingAnswer(text);
    if (pending) return { text: pending, label: 'LUYỆN TẬP' };
    if (pendingQuestion && !/^(?:dap an |chon )?[abcd](?:[.) ]|$)/i.test(normalize(text).trim())) pendingQuestion = null;

    const conceptFirst = explainConcept(text);
    if (conceptFirst) {
      const conceptId = currentTopic() !== 'all' ? currentTopic() : detectAliases(text);
      const conceptTopic = topicById(conceptId);
      const conceptSearch = /delta|biet thuc/.test(normalize(text)) ? 'tim nghiem va biet thuc delta' : /bat dang thuc|chia bat dang thuc/.test(normalize(text)) ? 'giai bat phuong trinh bac hai' : text;
      const conceptMatch = conceptTopic ? findBestForm(conceptSearch, conceptTopic.id) : null;
      detected = conceptMatch || (conceptTopic ? { topic: conceptTopic, form: conceptTopic.types[0], index: 0 } : detected);
      return { text: conceptFirst, label: 'GIẢI THÍCH BẢN CHẤT', match: detected };
    }

    const guidedStep = handlePendingStep(text);
    if (guidedStep) return { text: guidedStep, label: 'HƯỚNG DẪN TỪNG BƯỚC', match: detected };

    if (mode === 'similar' || /bai (tap )?tuong tu|luyen them|cho em mot bai|ra mot cau/i.test(normalize(text))) {
      const match = findBestForm(text, currentTopic()) || detected;
      const topic = match?.topic || topicById(currentTopic()) || topicById(detectAliases(text));
      if (topic) { detected = match || { topic, form: topic.types[0], index: 0 }; return { text: buildSimilarQuestion(topic, match?.form || topic.types[0]), label: 'BÀI TỰ LUYỆN', match }; }
    }

    const functionMatch = quadraticFunctionFromText(text);
    if (functionMatch) {
      detected = findBestForm('tim dinh va truc doi xung', 'quadratic');
      return { text: renderFunctionReply(functionMatch, text), label: 'PHÂN TÍCH HÀM SỐ', match: detected };
    }

    const inequality = inequalityFromText(text);
    if (inequality) {
      const result = solveQuadraticInequality(inequality.coefficients, inequality.relation);
      if (result) {
        detected = findBestForm('giai bat phuong trinh bac hai bang xet dau', 'quadratic-sign');
        return { text: renderInequalityReply(result, inequality.relation), label: 'GIẢI BẤT PHƯƠNG TRÌNH', match: detected };
      }
    }

    const equation = equationFromText(text);
    if (equation) {
      const solved = solveEquation(equation);
      store.stats.solved += 1;
      detected = findBestForm('tim nghiem va biet thuc delta', 'quadratic-sign');
      if (mode === 'check') {
        const checked = verifyCandidate(text, solved);
        store.stats.checked += 1;
        return { text: checked || `Mình đã giải được phương trình:\n${renderEquationReply(solved, 'solve', `${equation.left} = ${equation.right}`)}\n\nBạn hãy gửi các bước làm của bạn để mình so sánh từng phép biến đổi.`, label: 'KIỂM TRA LỜI GIẢI', match: detected };
      }
      return { text: renderEquationReply(solved, mode, `${equation.left} = ${equation.right}`), label: mode === 'hint' ? 'GỢI Ý' : 'LỜI GIẢI', match: detected };
    }

    if (mode === 'check') {
      const match = findBestForm(text, currentTopic());
      if (match) {
        detected = match;
        return { text: renderFormReply(match, 'check'), label: 'KIỂM TRA BÀI', match };
      }
      return { text: 'Bạn dán giúp mình đề bài cùng các bước đã làm. Mình sẽ kiểm tra lần lượt: điều kiện xác định, công thức, phép biến đổi, dấu và kết luận.', label: 'CHỜ BÀI LÀM' };
    }

    const previous = explainPrevious(text);
    if (previous) return { text: previous, label: 'GIẢI THÍCH BỔ SUNG', match: detected };

    const detectedTopicId = currentTopic() !== 'all' ? currentTopic() : detectAliases(text);
    const match = detectedTopicId !== 'all' ? (findBestForm(text, detectedTopicId) || findBestForm(text, currentTopic())) : findBestForm(text, currentTopic());
    if (match) {
      detected = match;
      return { text: renderFormReply(match, mode), label: mode === 'hint' ? 'GỢI Ý HỌC TẬP' : 'NHẬN DIỆN DẠNG TOÁN', match };
    }

    const aliasId = currentTopic() !== 'all' ? currentTopic() : detectAliases(text);
    const topic = topicById(aliasId);
    if (topic) {
      const form = topic.types[0]; detected = { topic, form, index: 0 };
      return { text: `Câu hỏi có vẻ liên quan đến chuyên đề ${topic.title}.\n\n${topic.description}\n\nCác ý chính cần nhớ:\n${topic.formulas.slice(0, 5).map((x, i) => `${i + 1}. ${x}`).join('\n')}\n\nBạn gửi một bài cụ thể hoặc chọn “Gợi ý” để mình bắt đầu từ bước đầu tiên nhé.`, label: 'KIẾN THỨC NỀN', match: detected };
    }

    return { text: `Mình chưa đủ dữ kiện để giải chính xác câu hỏi này. Bạn có thể thử:\n\n• Gửi nguyên đề bài và các dữ kiện.\n• Gõ phương trình dạng: x^2 - 5x + 6 = 0.\n• Chọn chuyên đề ở phía trên để giới hạn phạm vi.\n• Nói rõ bạn muốn “gợi ý”, “giải chi tiết” hay “kiểm tra lời giải”.\n\nHiện tại, gia sư cục bộ hỗ trợ tra cứu thư viện Toán 10, phương trình và bất phương trình bậc nhất/bậc hai dạng đơn giản, cùng phân tích hàm số bậc hai. Với bài hình học hoặc biểu thức phức tạp, mình sẽ hướng dẫn phương pháp từ học liệu thay vì đoán đáp án.`, label: 'CẦN THÊM DỮ KIỆN' };
  }

  async function remoteTutor(text, imageDataUrl = '') {
    const url = store.proxyUrl.trim();
    if (!url) return null;
    if (!/^https:\/\//i.test(url) && !/^http:\/\/localhost(?::\d+)?\//i.test(url)) {
      throw new Error('Địa chỉ backend phải dùng HTTPS (trừ localhost khi phát triển).');
    }
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 35000);
    try {
      const content = [{ type: 'input_text', text: text || 'Hãy đọc và giải bài Toán trong ảnh đính kèm.' }];
      if (imageDataUrl) content.push({ type: 'input_image', image_url: imageDataUrl, detail: 'high' });
      const response = await fetch(url, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: controller.signal,
        body: JSON.stringify({
          message: text || 'Hãy đọc và giải bài Toán trong ảnh đính kèm.',
          imageDataUrl: imageDataUrl || undefined,
          messages: store.messages.slice(0, -1).slice(-12).map(m => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.text })),
          profile: store.profile, grade: store.profile.grade || $('#tutorGrade')?.value || 'auto',
          selectedTopic: currentTopic(), mode: currentMode()
        })
      });
      if (!response.ok) {
        const payload = await response.json().catch(() => ({}));
        throw new Error(payload.error || `Backend trả về HTTP ${response.status}.`);
      }
      const data = await response.json();
      const reply = data.reply || data.answer || data.output_text;
      if (typeof reply !== 'string' || !reply.trim()) throw new Error('Backend không trả lời ở định dạng văn bản.');
      return reply.trim();
    } finally { clearTimeout(timer); }
  }

  function renderDetected(match) {
    const root = $('#tutorDetectedForm'); if (!root) return;
    if (!match?.topic || !match?.form) {
      root.className = 'tutor-detected-empty'; root.textContent = 'Chưa nhận diện dạng bài. Hãy gửi một câu hỏi để bắt đầu.'; return;
    }
    root.className = 'tutor-detected-card';
    root.innerHTML = `<b>${escapeHTML(match.form.name)}</b><p>${escapeHTML(match.topic.title)} · ${escapeHTML(match.form.level)}<br>${escapeHTML(match.form.recognize)}</p><button class="btn soft mini" data-form-topic="${escapeHTML(match.topic.id)}" data-form-index="${Number(match.index) || 0}">Mở bài học trong thư viện ↗</button>`;
  }
  function timeLabel(ts) {
    try { return new Date(ts).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }); }
    catch (_) { return ''; }
  }
  function renderMessages() {
    const root = $('#chatMessages'); if (!root) return;
    const welcome = $('#tutorWelcome');
    if (!store.messages.length) {
      $('#tutorFollowups')?.remove();
      if (welcome) welcome.classList.remove('hidden');
      root.querySelectorAll('.tutor-message').forEach(node => node.remove());
      return;
    }
    if (welcome) welcome.classList.add('hidden');
    root.querySelectorAll('.tutor-message').forEach(node => node.remove());
    store.messages.forEach((message, index) => {
      const article = document.createElement('article');
      article.className = `tutor-message ${message.role === 'user' ? 'user' : 'bot'}`;
      const head = document.createElement('div'); head.className = 'tutor-message-head';
      head.innerHTML = message.role === 'user'
        ? `<span>${timeLabel(message.time)}</span><b>Bạn</b>`
        : `<b>✦ AI Mentor</b><span>· ${escapeHTML(message.label || 'Gia sư Toán')}</span><span>· ${timeLabel(message.time)}</span>`;
      const body = document.createElement('div'); body.className = 'tutor-message-body';
      body.innerHTML = escapeHTML(message.text).replace(/\n/g, '<br>');
      article.append(head, body);
      if (message.role === 'assistant') {
        const meta = document.createElement('div'); meta.className = 'tutor-message-meta';
        const copy = document.createElement('button'); copy.type = 'button'; copy.textContent = 'Sao chép'; copy.dataset.tutorCopy = String(index);
        const note = document.createElement('button'); note.type = 'button'; note.textContent = '＋ Lưu sổ tay'; note.dataset.tutorNote = String(index);
        const helpful = document.createElement('button'); helpful.type = 'button'; helpful.textContent = 'Hữu ích ✓'; helpful.dataset.tutorHelpful = String(index);
        const tag = document.createElement('span'); tag.className = 'answer-tag'; tag.textContent = 'HỌC CÙNG AI';
        meta.append(tag, copy, note, helpful); article.append(meta);
      }
      root.append(article);
    });
    root.scrollTop = root.scrollHeight;
  }
  function pushMessage(role, text, label = '') {
    store.messages.push({ role, text: String(text), label, time: Date.now() });
    if (store.messages.length > MAX_MESSAGES) store.messages = store.messages.slice(-MAX_MESSAGES);
    persist(); renderMessages();
  }
  function renderNotes() {
    const root = $('#tutorNotes'); if (!root) return;
    $('#tutorNoteCount').textContent = `${store.notes.length} mục`;
    root.innerHTML = store.notes.length ? store.notes.slice(-8).reverse().map((note, index) => `<div class="tutor-note-row"><p>${escapeHTML(note.text.length > 230 ? note.text.slice(0, 230) + '…' : note.text)}</p><button data-tutor-delete-note="${store.notes.length - 1 - index}">Xóa ghi chú</button></div>`).join('') : '<div class="empty">Chưa có ghi chú nào.</div>';
    const stats = $('#tutorStatsLine');
    if (stats) stats.textContent = `Đã hỏi ${store.stats.asked} lượt · ${store.stats.solved} bài đã giải · ${store.stats.checked} lượt kiểm tra`;
  }
  function renderSessions() {
    const root = $('#tutorSessions'); if (!root) return;
    const count = $('#tutorSessionCount'); if (count) count.textContent = String(store.sessions.length);
    root.innerHTML = store.sessions.length ? store.sessions.slice(0, 6).map((session, index) => {
      const firstQuestion = session.messages?.find(m => m.role === 'user')?.text || 'Phiên học chưa có câu hỏi';
      const preview = firstQuestion.length > 66 ? firstQuestion.slice(0, 66) + '…' : firstQuestion;
      const date = new Date(session.createdAt || Date.now()).toLocaleDateString('vi-VN');
      return `<button class="tutor-session-row" data-tutor-session="${index}"><span class="session-mark">${index + 1}</span><span class="session-copy"><b>${escapeHTML(preview)}</b><small>${date} · ${(session.messages || []).length} tin nhắn</small></span><span class="session-arrow">↗</span></button>`;
    }).join('') : '<div class="empty">Các phiên học cũ sẽ xuất hiện ở đây khi bạn tạo phiên mới.</div>';
  }
  function restoreSession(index) {
    const session = store.sessions[index]; if (!session) return;
    if (store.messages.length) store.sessions.unshift({ id: `s${Date.now()}`, createdAt: Date.now(), messages: store.messages.slice(-40) });
    const selected = store.sessions.splice(index + (store.messages.length ? 1 : 0), 1)[0] || session;
    store.messages = (selected.messages || []).slice(-MAX_MESSAGES);
    store.sessions = store.sessions.slice(0, MAX_SESSIONS);
    pendingQuestion = null; pendingStep = null; lastSolution = null;
    persist(); renderMessages(); renderSessions();
    const lastUser = [...store.messages].reverse().find(m => m.role === 'user');
    const match = lastUser ? findBestForm(lastUser.text, 'all') : null;
    detected = match; renderDetected(match);
    toastTutor('Đã mở lại phiên học.');
  }

  function renderProfile() {
    const p = store.profile;
    if ($('#tutorGoal')) $('#tutorGoal').value = p.goal;
    if ($('#tutorGrade')) $('#tutorGrade').value = p.grade || 'auto';
    if ($('#tutorSelfLevel')) $('#tutorSelfLevel').value = p.selfLevel;
    if ($('#tutorLevel')) $('#tutorLevel').value = p.level;
    if ($('#tutorStyle')) $('#tutorStyle').value = p.style;
    if ($('#tutorProxyUrl')) $('#tutorProxyUrl').value = store.proxyUrl;
  }
  function fillTopicOptions() {
    const select = $('#tutorTopic'); if (!select || select.dataset.ready) return;
    LIBRARY.forEach(topic => {
      const option = document.createElement('option'); option.value = topic.id; option.textContent = topic.title; select.append(option);
    });
    select.dataset.ready = '1';
  }
  function showTyping(show) {
    const old = $('#tutorTyping'); if (old) old.remove();
    if (!show) return;
    const node = document.createElement('div'); node.id = 'tutorTyping'; node.className = 'tutor-typing';
    node.innerHTML = 'Gia sư đang suy nghĩ <i></i><i></i><i></i>';
    $('#chatMessages')?.append(node); $('#chatMessages').scrollTop = $('#chatMessages').scrollHeight;
  }
  function addFollowups(match, mode) {
    const root = $('#chatMessages'); if (!root) return;
    const old = $('#tutorFollowups'); if (old) old.remove();
    const box = document.createElement('div'); box.id = 'tutorFollowups'; box.className = 'tutor-followups';
    const prompts = match?.form ? [
      ['Giải kỹ hơn', `Giải chi tiết dạng ${match.form.name}`],
      ['Cho bài tương tự', `Cho em một bài tập tương tự về ${match.form.name}`],
      ['Kiểm tra cách làm', `Kiểm tra lời giải của em về ${match.form.name}`]
    ] : [['Gợi ý cách làm', 'Hãy gợi ý cách làm từng bước cho bài này'], ['Giải chi tiết', 'Hãy giải chi tiết bài vừa rồi'], ['Tạo câu luyện tập', 'Cho em một bài luyện tập tương tự']];
    prompts.forEach(([label, prompt]) => {
      const button = document.createElement('button'); button.type = 'button'; button.textContent = label; button.dataset.tutorFollowup = prompt; box.append(button);
    });
    root.append(box);
  }
  async function send() {
    if (busy) return;
    const input = $('#tutorInput'); if (!input) return;
    const text = input.value.trim();
    const imageDataUrl = selectedImageDataUrl;
    if (!text && !imageDataUrl) return;
    const question = text || 'Hãy đọc đề Toán trong ảnh và hướng dẫn em giải từng bước.';
    input.value = ''; input.style.height = 'auto';
    $('#tutorFollowups')?.remove();
    pushMessage('user', question + (imageDataUrl ? '\n[Đã đính kèm ảnh đề bài]' : ''));
    store.stats.asked += 1; persist();
    busy = true; $('#sendTutor').disabled = true; $('#sendTutor').textContent = 'Đang nghĩ…'; showTyping(true);
    let reply = '', label = 'GIA SƯ TOÁN', match = null, clearImage = false;
    try {
      if (imageDataUrl && !store.proxyUrl.trim()) {
        throw new Error('Ảnh đã được chọn nhưng AI đọc ảnh chưa thể hoạt động khi chưa kết nối endpoint AI riêng. Hãy nhờ phụ huynh/nhà trường cấu hình máy chủ AI trước.');
      }
      const remote = await remoteTutor(question, imageDataUrl);
      if (remote) {
        reply = remote; label = 'AI MENTOR · LỚP 1–12'; clearImage = Boolean(imageDataUrl);
        setStatus('AI Mentor riêng đang hoạt động · Toán lớp 1–12');
      } else {
        const result = localTutor(question); reply = result.text; label = result.label || label; match = result.match || detected;
        setStatus('Bộ máy học tập nội bộ sẵn sàng · Chưa kết nối AI riêng');
      }
    } catch (error) {
      if (imageDataUrl && !store.proxyUrl.trim()) {
        reply = 'Mình đã nhận ảnh bạn chọn, nhưng chưa gửi ảnh đi đâu cả. Tính năng đọc ảnh cần endpoint AI riêng được cấu hình trước.\n\nBạn vẫn có thể gõ lại đề bài bằng văn bản để dùng bộ giải cục bộ, hoặc nhờ phụ huynh/nhà trường cấu hình máy chủ AI cho website.';
        label = 'ẢNH ĐỀ BÀI · CHỜ KẾT NỐI';
      } else {
        const result = localTutor(question); reply = result.text + `\n\nLưu ý kết nối: ${error.message} Gia sư đã chuyển về chế độ cục bộ.`;
        label = result.label || label; match = result.match || detected; setStatus('Đang dùng chế độ cục bộ · Backend chưa phản hồi', true);
      }
    } finally {
      showTyping(false); busy = false; $('#sendTutor').disabled = false; $('#sendTutor').textContent = 'Gửi câu hỏi ↗';
    }
    if (clearImage) { selectedImageDataUrl = ''; renderTutorImagePreview(); }
    pushMessage('assistant', reply, label);
    renderDetected(match || detected); renderNotes();
    addFollowups(match || detected, currentMode());
  }

  function setMode(mode) {
    store.mode = mode;
    if (!['guide', 'hint'].includes(mode)) pendingStep = null;
    $$('.tutor-mode').forEach(button => button.classList.toggle('active', button.dataset.tutorMode === mode));
    const labels = { guide: 'SOCRATIC MODE', hint: 'HINT FIRST', solve: 'FULL SOLUTION', check: 'CHECK MY WORK', similar: 'PRACTICE MODE' };
    $('#tutorModeBadge').textContent = labels[mode] || 'SOCRATIC MODE';
    const placeholders = {
      guide: 'Nhập đề Toán hoặc câu hỏi bạn đang vướng…', hint: 'Gửi bài toán để nhận gợi ý đầu tiên, chưa tiết lộ toàn bộ đáp án…',
      solve: 'Dán bài toán cần giải chi tiết…', check: 'Dán đề bài và lời giải bạn đã làm để gia sư kiểm tra…', similar: 'Chọn chuyên đề rồi yêu cầu tạo câu luyện tập tương tự…'
    };
    $('#tutorInput').placeholder = placeholders[mode];
    persist();
  }
  function exportConversation() {
    if (!store.messages.length) { toastTutor('Chưa có hội thoại để xuất.'); return; }
    const lines = ['AI MENTOR — HỘI THOẠI GIA SƯ TOÁN LỚP 1–12', `Xuất lúc: ${new Date().toLocaleString('vi-VN')}`, ''];
    store.messages.forEach(m => lines.push(`${m.role === 'user' ? 'BẠN' : 'AI MENTOR'} · ${new Date(m.time).toLocaleString('vi-VN')}`, m.text, ''));
    const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = 'AI-Mentor-hoi-thoai-gia-su.txt'; a.click(); URL.revokeObjectURL(url);
    toastTutor('Đã xuất hội thoại.');
  }
  function startNewSession() {
    if (store.messages.length) store.sessions.unshift({ id: `s${Date.now()}`, createdAt: Date.now(), messages: store.messages.slice(-40) });
    store.sessions = store.sessions.slice(0, MAX_SESSIONS); store.messages = []; pendingQuestion = null; pendingStep = null; lastSolution = null; detected = null;
    persist(); renderMessages(); renderDetected(null); renderSessions(); toastTutor('Đã tạo phiên học mới.');
  }
  function clearCurrentSession() {
    if (!store.messages.length) return;
    if (!confirm('Xóa toàn bộ tin nhắn trong phiên học hiện tại?')) return;
    store.messages = []; pendingQuestion = null; pendingStep = null; lastSolution = null; persist(); renderMessages(); renderDetected(null); toastTutor('Đã xóa hội thoại hiện tại.');
  }
  function saveProfile() {
    store.profile = {
      ...store.profile,
      goal: $('#tutorGoal').value,
      grade: $('#tutorGrade')?.value || 'auto',
      selfLevel: $('#tutorSelfLevel').value,
      level: $('#tutorLevel').value,
      style: $('#tutorStyle').value
    };
    persist(); $('#tutorProfileFeedback').textContent = 'Đã lưu. Gia sư sẽ dùng lựa chọn này trong các lượt hỏi tiếp theo.';
    toastTutor('Đã lưu hồ sơ học tập.');
  }
  function saveProxy() {
    const url = $('#tutorProxyUrl').value.trim();
    if (url && !/^https:\/\//i.test(url) && !/^http:\/\/localhost(?::\d+)?\//i.test(url)) {
      toastTutor('Địa chỉ API cần HTTPS hoặc localhost khi phát triển.'); return;
    }
    if (url && !confirm('Khi bật kết nối, nội dung câu hỏi và một phần lịch sử gần đây sẽ được gửi đến máy chủ bạn nhập. Chỉ tiếp tục nếu đây là máy chủ đáng tin cậy.')) return;
    store.proxyUrl = url; persist();
    setStatus(url ? 'Đã cấu hình backend proxy · Gửi câu hỏi sẽ gọi máy chủ' : 'Bộ máy học tập nội bộ sẵn sàng');
    toastTutor(url ? 'Đã lưu địa chỉ backend.' : 'Đã tắt kết nối AI trực tuyến.');
  }
  function handleClick(event) {
    const mode = event.target.closest('[data-tutor-mode]');
    if (mode) { setMode(mode.dataset.tutorMode); return; }
    const follow = event.target.closest('[data-tutor-followup]');
    if (follow) { $('#tutorInput').value = follow.dataset.tutorFollowup; send(); return; }
    const copy = event.target.closest('[data-tutor-copy]');
    if (copy) {
      const message = store.messages[Number(copy.dataset.tutorCopy)];
      if (message) navigator.clipboard?.writeText(message.text).then(() => toastTutor('Đã sao chép lời giải.')).catch(() => toastTutor('Trình duyệt không cho phép sao chép tự động.'));
      return;
    }
    const note = event.target.closest('[data-tutor-note]');
    if (note) {
      const message = store.messages[Number(note.dataset.tutorNote)];
      if (message && !store.notes.some(n => n.text === message.text)) {
        store.notes.push({ text: message.text, createdAt: Date.now() }); persist(); renderNotes(); toastTutor('Đã lưu vào sổ tay.');
      } else toastTutor('Ghi chú này đã được lưu.');
      return;
    }
    const helpful = event.target.closest('[data-tutor-helpful]');
    if (helpful) { store.stats.helpful += 1; persist(); helpful.textContent = 'Đã ghi nhận ✓'; helpful.disabled = true; toastTutor('Cảm ơn phản hồi của bạn.'); return; }
    const del = event.target.closest('[data-tutor-delete-note]');
    if (del) { store.notes.splice(Number(del.dataset.tutorDeleteNote), 1); persist(); renderNotes(); return; }
    const session = event.target.closest('[data-tutor-session]');
    if (session) { restoreSession(Number(session.dataset.tutorSession)); return; }
  }
  function init() {
    if (!$('#page-tutor')) return;
    fillTopicOptions(); renderProfile(); renderMessages(); renderNotes(); renderSessions();
    if (store.proxyUrl) setStatus('Đã cấu hình backend proxy · Có thể gọi AI trực tuyến');
    setMode(store.mode || 'guide');
    document.addEventListener('click', handleClick);
    $('#tutorNewChat')?.addEventListener('click', startNewSession);
    $('#tutorClearChat')?.addEventListener('click', clearCurrentSession);
    $('#tutorExportChat')?.addEventListener('click', exportConversation);
    $('#tutorSaveProfile')?.addEventListener('click', saveProfile);
    $('#tutorSaveProxy')?.addEventListener('click', saveProxy);
    $('#tutorAttachImage')?.addEventListener('click', () => $('#tutorImageInput')?.click());
    $('#tutorImageInput')?.addEventListener('change', async event => {
      const file = event.target.files?.[0]; if (!file) return;
      try { selectedImageDataUrl = await prepareTutorImage(file); renderTutorImagePreview(); toastTutor('Đã chọn ảnh đề bài.'); }
      catch (error) { selectedImageDataUrl = ''; renderTutorImagePreview(); toastTutor(error.message || 'Không thể dùng ảnh này.'); }
      event.target.value = '';
    });
    $('#tutorRemoveImage')?.addEventListener('click', () => { selectedImageDataUrl = ''; renderTutorImagePreview(); });
    renderTutorImagePreview();
    $('#tutorInput')?.addEventListener('input', e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 180) + 'px'; });
  }

  window.AIMentorTutor = {
    send, setMode, exportConversation, getStats: () => structuredClone(store.stats),
    // Exposed pure helpers make classroom testing and future unit tests possible.
    diagnostics: { normalize, parsePolynomial, extractRelation, equationFromText, solveEquation, inequalityFromText, solveQuadraticInequality, quadraticFunctionFromText, findBestForm, localTutor }
  };
  init();
})();

</script>
<script>
/*
 * AI Mentor — Mô phỏng định dạng Toán 2026 (phần thi thử Toán 10)
 * Bộ câu hỏi do nhóm biên soạn mới để luyện tập; không sao chép đề thi chính thức.
 * Format tham chiếu: 12 MCQ + 4 nhóm đúng/sai (4 ý/nhóm) + 6 trả lời ngắn; 90 phút.
 */
(() => {
  'use strict';
  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => [...r.querySelectorAll(s)];
  const KEY = 'aiMentorToan10Exam2026_v1';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const mc = (topic, level, q, o, a, e) => ({topic, level, q, o, a, e});
  const tf = (topic, title, context, statements) => ({topic, title, context, statements});
  const sa = (topic, level, q, answer, e, hint='') => ({topic, level, q, answer, e, hint});

  const MC_BANK = [
    mc('Mệnh đề và tập hợp','Cơ bản','Cho A={1,2,3,4}, B={3,4,5}. Tập A∩B là:', ['{1,2}','{3,4}','{1,2,3,4,5}','{5}'],1,'Giao gồm các phần tử thuộc đồng thời cả A và B, nên A∩B={3,4}.'),
    mc('Mệnh đề và tập hợp','Vận dụng','Lớp có 32 học sinh; 19 bạn thích Toán, 17 bạn thích Tin học, 8 bạn thích cả hai. Số bạn không thích môn nào là:', ['2','4','6','8'],1,'Số bạn thích ít nhất một môn =19+17−8=28. Vậy số bạn không thích môn nào =32−28=4.'),
    mc('Bất phương trình','Cơ bản','Điểm nào sau đây thuộc miền nghiệm của x+2y≤6?', ['(2;2)','(3;2)','(0;4)','(6;1)'],0,'Thử (2;2): 2+2·2=6 nên thỏa mãn. Các điểm còn lại cho vế trái lớn hơn 6.'),
    mc('Bất phương trình','Vận dụng','Miền nghiệm của hệ x≥0, y≥0, x+y≤5 là tam giác có các đỉnh:', ['(0;0),(5;0),(0;5)','(0;0),(5;0),(5;5)','(0;5),(5;5),(0;0)','(−5;0),(0;5),(0;0)'],0,'Hai điều kiện đầu chọn góc phần tư thứ nhất; đường x+y=5 cắt hai trục tại (5;0) và (0;5).'),
    mc('Hàm số','Cơ bản','Tập xác định của hàm số f(x)=√(3x−6) là:', ['(−∞;2]','[2;+∞)','(2;+∞)','ℝ'],1,'Điều kiện 3x−6≥0 suy ra x≥2. Dấu bằng được nhận nên D=[2;+∞).'),
    mc('Hàm số','Vận dụng','Hàm số nào sau đây là hàm số chẵn trên ℝ?', ['f(x)=x³+x','g(x)=x²+5','h(x)=x²+x','k(x)=x³−1'],1,'g(−x)=(−x)²+5=x²+5=g(x), do đó g là hàm chẵn.'),
    mc('Hàm số bậc hai','Cơ bản','Đỉnh của parabol y=x²−6x+5 là:', ['(3;−4)','(−3;−4)','(3;4)','(−3;5)'],0,'xI=−b/(2a)=6/2=3; yI=9−18+5=−4.'),
    mc('Hàm số bậc hai','Vận dụng','Giá trị nhỏ nhất của y=2x²−8x+11 trên ℝ là:', ['−3','2','3','11'],2,'Đỉnh có hoành độ x=−(−8)/(2·2)=2; y(2)=8−16+11=3. Vì a>0 nên đây là GTNN.'),
    mc('Dấu tam thức bậc hai','Cơ bản','Tập nghiệm của x²−7x+12≤0 là:', ['(−∞;3]∪[4;+∞)','[3;4]','(3;4)','ℝ'],1,'x²−7x+12=(x−3)(x−4). Tam thức mở lên nên không dương giữa hai nghiệm, lấy cả hai đầu mút.'),
    mc('Dấu tam thức bậc hai','Nâng cao','Giá trị m để x²−4x+m>0 với mọi x∈ℝ là:', ['m>4','m≥4','m<4','m≤4'],0,'Vì a=1>0, để tam thức luôn dương cần Δ<0. Δ=16−4m<0 suy ra m>4.'),
    mc('Phương trình','Cơ bản','Nghiệm của phương trình x²−9=0 là:', ['x=−3','x=3','x=±3','x=0'],2,'x²=9 nên x=3 hoặc x=−3.'),
    mc('Phương trình','Vận dụng','Phương trình √(x+2)=x có nghiệm là:', ['−1','1','2','Không có nghiệm'],2,'Điều kiện x≥0. Bình phương: x+2=x², tức (x−2)(x+1)=0. Chỉ x=2 thỏa điều kiện.'),

  let exam=null, timer=null, remaining=90*60, startedAt=0;
  let history=loadHistory();
  function loadHistory(){try{return JSON.parse(localStorage.getItem(KEY)||'[]').slice(-10);}catch{return[];}}
  function saveHistory(){try{localStorage.setItem(KEY,JSON.stringify(history));}catch{}}
  function seededShuffle(arr, seed){const a=[...arr];let s=seed>>>0;const rand=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function makeExam(code){const n=Number(code.replace(/\D/g,''))||1;const seed=202600+n*97;return {code,mc:seededShuffle(MC_BANK,seed).slice(0,12),tf:seededShuffle(TF_BANK,seed+1).slice(0,4),sa:seededShuffle(SA_BANK,seed+2).slice(0,6),answers:{mc:Array(12).fill(null),tf:Array.from({length:4},()=>Array(4).fill(null)),sa:Array(6).fill('')}};}
  function showToast(msg){const el=$('#toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>el.classList.remove('show'),2300);}
  function fmtTime(sec){const m=Math.floor(sec/60),s=sec%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
  function renderHistory(){const root=$('#examHistory');if(!root)return;root.innerHTML=history.length?history.slice().reverse().map(h=>`<div class="exam-history-row"><div><b>${esc(h.code)} · ${esc(h.date)}</b><small>${h.correctPrompts}/34 ý hỏi đúng</small></div><strong>${h.score.toFixed(2).replace('.',',')}/10</strong></div>`).join(''):'<div class="empty">Bạn chưa hoàn thành đề mô phỏng nào.</div>';}
  function start(){const code=$('#examVersion').value;exam=makeExam(code);currentItem=0;remaining=90*60;startedAt=Date.now();$('#examIntro').classList.add('hidden');$('#examResult').classList.add('hidden');$('#examWorkspace').classList.remove('hidden');renderQuestion();startTimer();window.scrollTo({top:0,behavior:'smooth'});}
  function startTimer(){clearInterval(timer);updateTimer();timer=setInterval(()=>{remaining--;updateTimer();if(remaining<=0){clearInterval(timer);finish(true);}},1000);}
  function updateTimer(){const el=$('#examTimer');if(!el)return;el.textContent=fmtTime(Math.max(0,remaining));el.classList.toggle('urgent',remaining<=10*60);}
  function flattenItems(){if(!exam)return[];return [
    ...exam.mc.map((q,i)=>({section:'I',kind:'mc',index:i,label:`I.${i+1}`})),
    ...exam.tf.map((q,i)=>({section:'II',kind:'tf',index:i,label:`II.${i+1}`})),
    ...exam.sa.map((q,i)=>({section:'III',kind:'sa',index:i,label:`III.${i+1}`}))
  ];}
  let currentItem=0;
  function answeredCount(){return exam.answers.mc.filter(x=>x!==null).length+exam.answers.tf.flat().filter(x=>x!==null).length+exam.answers.sa.filter(x=>x.trim()!=='').length;}
  function renderPalette(){const root=$('#examPalette');const items=flattenItems();root.innerHTML=items.map((it,i)=>{const done=it.kind==='mc'?exam.answers.mc[it.index]!==null:it.kind==='tf'?exam.answers.tf[it.index].every(x=>x!==null):exam.answers.sa[it.index].trim()!=='';return `<button class="exam-jump ${i===currentItem?'current':''} ${done?'done':''}" data-exam-jump="${i}" title="${it.label}">${it.label}</button>`;}).join('');$('#examAnswered').textContent=`${answeredCount()}/34 ý đã trả lời`;}
  function setCurrent(idx){currentItem=Math.max(0,Math.min(21,idx));renderQuestion();}
  function renderQuestion(){if(!exam)return;const items=flattenItems(),it=items[currentItem];$('#examPartLabel').textContent=it.section==='I'?'PHẦN I · NHIỀU LỰA CHỌN':it.section==='II'?'PHẦN II · ĐÚNG / SAI':'PHẦN III · TRẢ LỜI NGẮN';$('#examQuestionNo').textContent=`Câu ${it.label}`;$('#examTopicTag').textContent=it.kind==='mc'?exam.mc[it.index].topic:it.kind==='tf'?exam.tf[it.index].topic:exam.sa[it.index].topic;
    let html='';
    if(it.kind==='mc'){const q=exam.mc[it.index];html=`<div class="exam-prompt">${esc(q.q)}</div><div class="exam-options">${q.o.map((o,j)=>`<button class="exam-option ${exam.answers.mc[it.index]===j?'selected':''}" data-exam-mc="${j}"><span>${'ABCD'[j]}</span>${esc(o)}</button>`).join('')}</div><p class="exam-hint">Mỗi câu trả lời đúng được 0,25 điểm.</p>`;}
    if(it.kind==='tf'){const q=exam.tf[it.index];html=`<div class="exam-context"><b>${esc(q.title)}</b><p>${esc(q.context)}</p></div><div class="exam-statements">${q.statements.map((s,j)=>`<div class="exam-statement"><div><b>${'abcd'[j]}.</b> ${esc(s.text)}</div><div class="tf-choice"><button class="${exam.answers.tf[it.index][j]===true?'selected':''}" data-exam-tf="true">Đúng</button><button class="${exam.answers.tf[it.index][j]===false?'selected':''}" data-exam-tf="false">Sai</button></div></div>`).join('')}</div><p class="exam-hint">Mỗi nhóm có 4 ý. Điểm từng nhóm: đúng 1 ý = 0,1; 2 ý = 0,25; 3 ý = 0,5; 4 ý = 1,0 điểm.</p>`;}
    if(it.kind==='sa'){const q=exam.sa[it.index];html=`<div class="exam-prompt">${esc(q.q)}</div><div class="short-answer-box"><label for="examShort">Đáp án của bạn</label><input id="examShort" class="field" inputmode="decimal" autocomplete="off" placeholder="Nhập kết quả (ví dụ: 0,5 hoặc 1/2)" value="${esc(exam.answers.sa[it.index])}"><small>Nhập kết quả số; chấp nhận dấu phẩy thập phân hoặc phân số đơn giản.</small></div><p class="exam-hint">Mỗi câu trả lời đúng được 0,5 điểm.</p>`;}
    $('#examQuestionBody').innerHTML=html;$('#examPrev').disabled=currentItem===0;$('#examNext').disabled=currentItem===21;$('#examNext').textContent=currentItem===21?'Đến câu cuối':'Câu tiếp →';renderPalette();}
  function currentIndex(){return flattenItems()[currentItem];}
  function parseNumeric(v){let s=String(v??'').trim().replace(/\s+/g,'').replace(',','.');if(!s)return NaN;const frac=s.match(/^([+-]?\d+(?:\.\d+)?)\/([+-]?\d+(?:\.\d+)?)$/);if(frac){const d=Number(frac[2]);return d===0?NaN:Number(frac[1])/d;}return Number(s);}
  function grade(){let part1=0,part2=0,part3=0,correctPrompts=0,review=[];
    exam.mc.forEach((q,i)=>{const ok=exam.answers.mc[i]===q.a;if(ok){part1+=.25;correctPrompts++;}review.push({section:'I',label:`I.${i+1}`,q:q.q,answer:q.o[q.a],user:exam.answers.mc[i]===null?'Chưa trả lời':q.o[exam.answers.mc[i]],ok,why:q.e});});
    const partial=[0,.1,.25,.5,1];
    exam.tf.forEach((q,i)=>{let hits=0;q.statements.forEach((s,j)=>{const ok=exam.answers.tf[i][j]===s.a;if(ok){hits++;correctPrompts++;}review.push({section:'II',label:`II.${i+1}${'abcd'[j]}`,q:s.text,answer:s.a?'Đúng':'Sai',user:exam.answers.tf[i][j]===null?'Chưa trả lời':exam.answers.tf[i][j]?'Đúng':'Sai',ok,why:s.why});});part2+=partial[hits];});
    exam.sa.forEach((q,i)=>{const val=parseNumeric(exam.answers.sa[i]),ok=Number.isFinite(val)&&Math.abs(val-q.answer)<=1e-6;if(ok){part3+=.5;correctPrompts++;}review.push({section:'III',label:`III.${i+1}`,q:q.q,answer:String(q.answer).replace('.',','),user:exam.answers.sa[i].trim()||'Chưa trả lời',ok,why:q.e});});
    return {part1,part2,part3,score:part1+part2+part3,correctPrompts,review};}
  function finish(auto=false){if(!exam)return;clearInterval(timer);timer=null;const g=grade(),elapsed=Math.round((Date.now()-startedAt)/60000);const record={code:exam.code,date:new Date().toLocaleString('vi-VN'),score:g.score,correctPrompts:g.correctPrompts,elapsed};history.push(record);history=history.slice(-10);saveHistory();
    $('#examWorkspace').classList.add('hidden');$('#examResult').classList.remove('hidden');$('#examScore').textContent=g.score.toFixed(2).replace('.',',');$('#examScoreLine').textContent=`${g.correctPrompts}/34 ý hỏi đúng · ${elapsed} phút${auto?' · Hết giờ, hệ thống tự nộp bài.':''}`;$('#examPartScores').innerHTML=`<div><b>${g.part1.toFixed(2).replace('.',',')}/3</b><small>Phần I</small></div><div><b>${g.part2.toFixed(2).replace('.',',')}/4</b><small>Phần II</small></div><div><b>${g.part3.toFixed(2).replace('.',',')}/3</b><small>Phần III</small></div>`;
    $('#examReview').innerHTML=g.review.map(r=>`<article class="exam-review-card"><div class="exam-review-top"><b>${r.label} · ${esc(r.q)}</b><span class="pill ${r.ok?'green':'amber'}">${r.ok?'Đúng':'Chưa đúng'}</span></div><p class="exam-review-answer">Bạn trả lời: ${esc(r.user)} · Đáp án: <b>${esc(r.answer)}</b></p><div class="exam-explain">${esc(r.why)}</div></article>`).join('');renderHistory();window.scrollTo({top:0,behavior:'smooth'});exam=null;}
  function bind(){
    const startBtn=$('#startExam2026');if(!startBtn)return;
    startBtn.addEventListener('click',start);
    $('#examPrev').addEventListener('click',()=>setCurrent(currentItem-1));$('#examNext').addEventListener('click',()=>setCurrent(currentItem+1));
    $('#examSubmit').addEventListener('click',()=>{const left=34-answeredCount();if(left>0&&!confirm(`Bạn còn ${left} ý chưa trả lời. Bạn vẫn muốn nộp bài?`))return;finish(false);});
    $('#examNew').addEventListener('click',()=>{$('#examResult').classList.add('hidden');$('#examIntro').classList.remove('hidden');renderHistory();window.scrollTo({top:0,behavior:'smooth'});});
    $('#examQuestionBody').addEventListener('click',e=>{const mcBtn=e.target.closest('[data-exam-mc]');if(mcBtn){const it=currentIndex();exam.answers.mc[it.index]=Number(mcBtn.dataset.examMc);renderQuestion();return;}const tfBtn=e.target.closest('[data-exam-tf]');if(tfBtn){const it=currentIndex();const statement=e.target.closest('.exam-statement');const idx=$$('.exam-statement',$('#examQuestionBody')).indexOf(statement);exam.answers.tf[it.index][idx]=tfBtn.dataset.examTf==='true';renderQuestion();}});
    $('#examQuestionBody').addEventListener('input',e=>{if(e.target.id==='examShort'){const it=currentIndex();exam.answers.sa[it.index]=e.target.value;renderPalette();}});
    $('#examPalette').addEventListener('click',e=>{const b=e.target.closest('[data-exam-jump]');if(b)setCurrent(Number(b.dataset.examJump));});
    renderHistory();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();

</script>
</body></html>
