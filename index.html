      ['Mệnh đề phủ định của P: ¬P.','¬(∀x∈X, P(x)) ⇔ ∃x∈X: ¬P(x).','¬(∃x∈X, P(x)) ⇔ ∀x∈X: ¬P(x).','A∪B: phần tử thuộc A hoặc B; A∩B: thuộc cả A và B.','A\\B: thuộc A nhưng không thuộc B.','|A∪B|=|A|+|B|−|A∩B|.'],[
      F('Nhận biết mệnh đề và xét tính đúng/sai','Câu khẳng định có thể xác định đúng hoặc sai; câu hỏi, mệnh lệnh và biểu thức chứa biến chưa xác định thường chưa là mệnh đề.',['Xác định câu có phải câu khẳng định không.','Kiểm tra câu có chứa biến chưa được lượng hóa hay không.','Thử đối chiếu định nghĩa hoặc tìm phản ví dụ để kết luận đúng/sai.'],'“7 là số nguyên tố” và “x+2=5” có phải mệnh đề không?',['Câu “7 là số nguyên tố” là câu khẳng định có giá trị đúng.','Câu “x+2=5” còn phụ thuộc vào giá trị x nên là mệnh đề chứa biến, chưa có giá trị đúng/sai cố định.'],'Câu thứ nhất là mệnh đề đúng; câu thứ hai là mệnh đề chứa biến.','Nhầm biểu thức chứa biến với mệnh đề đã xác định; chỉ nhìn thấy dấu bằng rồi kết luận là mệnh đề.','Cơ bản',''),
      F('Phủ định mệnh đề và lượng từ','Xuất hiện các từ “mọi”, “tất cả”, “tồn tại”, “có ít nhất”, hoặc yêu cầu tìm mệnh đề phủ định.',['Giữ nguyên miền xác định.','Đổi ∀ thành ∃ hoặc ∃ thành ∀.','Phủ định vị từ bên trong: đúng ↔ sai, > ↔ ≤, = ↔ ≠.'],'Phủ định: “Với mọi x∈ℝ, x²≥0”.',['Đổi “với mọi” thành “tồn tại”.','Phủ định x²≥0 thành x²<0.'],'“Tồn tại x∈ℝ sao cho x²<0”. Đây là mệnh đề sai, nhưng là phủ định đúng về mặt logic.','Chỉ đổi lượng từ mà quên phủ định phần điều kiện; đổi > thành < thay vì ≤.','Cơ bản','¬∀=∃¬; ¬∃=∀¬'),
      F('Tập hợp con, bằng nhau và tập rỗng','Đề yêu cầu chứng minh A⊂B, A=B hoặc xác định tập rỗng.',['Muốn chứng minh A⊂B: lấy phần tử bất kỳ x∈A và chứng minh x∈B.','Muốn chứng minh A=B: chứng minh A⊂B và B⊂A.','Tìm điều kiện để không có phần tử nào thỏa mãn khi xét tập rỗng.'],'A={1,2}, B={1,2,3}. Xét quan hệ giữa A và B.',['Mọi phần tử của A là 1 hoặc 2.','Cả 1 và 2 đều thuộc B.'],'A⊂B và A≠B.','Chỉ kiểm tra một phần tử; nhầm A∈B với A⊂B.','Cơ bản','∅⊂A với mọi tập A.'),
      F('Hợp, giao, hiệu và phần bù','Đề cho hai hoặc nhiều tập hợp, khoảng số hoặc yêu cầu biểu diễn trên trục số.',['Viết rõ từng tập theo điều kiện hoặc phần tử.','Hợp: gom phần tử thuộc ít nhất một tập.','Giao: chỉ giữ phần tử chung.','Hiệu A\\B: bỏ khỏi A các phần tử của B; phần bù phải xác định tập vũ trụ.'],'A=[−2;3), B=(1;5]. Tính A∩B và A∪B.',['Phần giao lấy phần chung từ ngay sau 1 đến trước 3?','1 thuộc A và không thuộc B nên không thuộc giao; 3 không thuộc A nên không thuộc giao.','Phần hợp nối hai khoảng vì chúng chồng lấn.'],'A∩B=(1;3); A∪B=[−2;5].','Quên xét dấu ngoặc tại đầu mút; dùng phần bù khi chưa nêu tập vũ trụ.','Cơ bản','|A∪B|=|A|+|B|−|A∩B|'),
      F('Bài toán đếm bằng biểu đồ Ven','Có hai nhóm đối tượng, biết số phần tử mỗi nhóm và phần giao hoặc tổng số.',['Đặt số phần tử từng vùng trong biểu đồ Ven.','Tính phần giao trước nếu cần: n(A∩B)=n(A)+n(B)−n(A∪B).','Tính chỉ thuộc A, chỉ thuộc B, hoặc không thuộc nhóm nào.'],'Lớp có 30 bạn; 18 bạn thích Toán, 16 bạn thích Anh, 8 bạn thích cả hai. Có bao nhiêu bạn không thích môn nào trong hai môn?',['Số bạn thích ít nhất một môn =18+16−8=26.','Số bạn không thích môn nào =30−26.'],'4 bạn.','Cộng hai nhóm mà không trừ phần giao nên đếm trùng.','Vận dụng','n(A∪B)=n(A)+n(B)−n(A∩B)'),
      F('Mệnh đề kéo theo, đảo và tương đương','Đề xuất hiện “nếu… thì…”, “điều kiện cần”, “điều kiện đủ” hoặc yêu cầu xét mệnh đề đảo.',['Với P⇒Q, P là giả thiết, Q là kết luận.','Mệnh đề đảo là Q⇒P; không mặc nhiên đúng.','P⇔Q đúng khi cả P⇒Q và Q⇒P đều đúng.','Điều kiện đủ: P đủ để suy ra Q; điều kiện cần: Q cần có khi P xảy ra.'],'Xét: “Nếu n chia hết cho 4 thì n là số chẵn”. Mệnh đề đảo có đúng không?',['Mệnh đề ban đầu đúng vì n=4k ⇒ n=2(2k).','Mệnh đề đảo: nếu n chẵn thì n chia hết cho 4.','Phản ví dụ n=2: n chẵn nhưng không chia hết cho 4.'],'Mệnh đề đảo sai; ví dụ n=2.','Cho rằng mệnh đề đảo luôn tương đương với mệnh đề ban đầu.','Vận dụng','P⇒Q không đồng nghĩa Q⇒P.')
    ],['Phân biệt mệnh đề với mệnh đề chứa biến.','Phủ định đúng cả lượng từ và vị từ.','Với phần bù, luôn xác định tập vũ trụ.','Mệnh đề đảo không mặc nhiên đúng.']),

      ['ax+by+c>0, ≥0, <0 hoặc ≤0 (a,b không đồng thời bằng 0).','Đường biên: ax+by+c=0.','Miền nghiệm hệ là giao các miền nghiệm thành phần.','Giá trị lớn nhất/nhỏ nhất của hàm tuyến tính trên miền đa giác đạt tại một đỉnh (khi miền đóng, bị chặn và bài toán có cực trị).'],[
      F('Kiểm tra một điểm có là nghiệm','Đề cho điểm M(x₀;y₀) và bất phương trình ax+by+c ⋚ 0.',['Thay x=x₀, y=y₀ vào vế trái.','So sánh kết quả với 0 theo đúng dấu bất phương trình.'],'Điểm M(1;2) có là nghiệm của 2x+y≤5 không?',['Thay vào: 2·1+2=4.','Vì 4≤5 nên điểm thỏa mãn.'],'Có, M(1;2) là nghiệm.','Đảo dấu bất phương trình hoặc chỉ thay một tọa độ.','Cơ bản',''),
      F('Biểu diễn miền nghiệm một bất phương trình','Xuất hiện yêu cầu tô nửa mặt phẳng nghiệm của ax+by+c ⋚ 0.',['Vẽ đường thẳng biên ax+by+c=0 bằng hai điểm.','Nếu dấu ≤ hoặc ≥, đường biên vẽ nét liền; nếu < hoặc >, đường biên vẽ nét đứt.','Chọn điểm thử không nằm trên đường biên, thường là O(0;0).','Thay điểm thử để chọn nửa mặt phẳng đúng.'],'Biểu diễn miền nghiệm  x+y≤4.',['Đường biên x+y=4 đi qua (4;0) và (0;4).','Dấu ≤ nên vẽ đường liền.','Thử O(0;0): 0≤4 đúng, chọn nửa mặt phẳng chứa O.'],'Nửa mặt phẳng kể cả đường thẳng x+y=4 và chứa gốc tọa độ.','Chọn nhầm phía đường thẳng; quên đường biên liền/nét đứt.','Cơ bản',''),
      F('Biểu diễn miền nghiệm của hệ','Hệ gồm nhiều bất phương trình; cần tìm phần chung của các miền.',['Vẽ từng đường biên.','Xác định nửa mặt phẳng nghiệm của từng bất phương trình.','Lấy giao tất cả các miền; đánh dấu các đỉnh nếu miền là đa giác.'],'Xét hệ x≥0, y≥0, x+y≤4.',['x≥0 chọn nửa mặt phẳng bên phải trục Oy.','y≥0 chọn nửa mặt phẳng phía trên trục Ox.','x+y≤4 chọn phía chứa O.'],'Miền tam giác có các đỉnh (0;0), (4;0), (0;4).','Chỉ vẽ miền của bất phương trình cuối; bỏ qua điều kiện x,y không âm.','Vận dụng','Miền nghiệm hệ = giao các miền nghiệm.'),
      F('Bài toán tối ưu tuyến tính','Đề yêu cầu lợi nhuận/chi phí lớn nhất hoặc nhỏ nhất dưới các ràng buộc tuyến tính.',['Đặt biến và viết các điều kiện thành hệ bất phương trình.','Xác định các đỉnh miền nghiệm.','Tính giá trị biểu thức mục tiêu tại từng đỉnh.','So sánh và kết luận theo ngữ cảnh.'],'Tìm max P=2x+y với x≥0, y≥0, x+y≤4.',['Các đỉnh: (0;0), (4;0), (0;4).','P lần lượt là 0, 8, 4.','Giá trị lớn nhất là 8 tại (4;0).'],'Pmax=8 tại (x;y)=(4;0).','Chỉ thử một điểm; quên kiểm tra tất cả đỉnh; kết luận không gắn ý nghĩa thực tế.','Nâng cao','P=ax+by; xét P tại các đỉnh miền nghiệm')
    ],['Vẽ đúng đường biên và chọn đúng nửa mặt phẳng.','Miền nghiệm hệ là phần giao.','Bài tối ưu cần kiểm tra các đỉnh.']),

    T('functions','Hàm số và đồ thị','ĐẠI SỐ','ƒ','Đọc hiểu hàm số, tập xác định, giá trị, tính chẵn lẻ, tính đồng biến/nghịch biến và đồ thị.',
      ['Tập xác định D: các giá trị x để biểu thức có nghĩa.','f(a): thay x=a vào biểu thức.','Hàm chẵn: f(−x)=f(x); hàm lẻ: f(−x)=−f(x), với miền xác định đối xứng.','Đồng biến trên I: x₁<x₂ ⇒ f(x₁)<f(x₂).','Nghịch biến trên I: x₁<x₂ ⇒ f(x₁)>f(x₂).'],[
      F('Tìm tập xác định của hàm số','Biểu thức có mẫu, căn bậc chẵn hoặc điều kiện log (nếu học mở rộng).',['Mẫu số phải khác 0.','Biểu thức dưới căn bậc chẵn phải ≥0.','Lấy giao tất cả điều kiện.'],'Tìm tập xác định của f(x)=√(x−2).',['Điều kiện: x−2≥0.','Suy ra x≥2.'],'D=[2;+∞).','Quên điều kiện căn không âm; chỉ kiểm tra mẫu mà quên căn hoặc ngược lại.','Cơ bản',''),
      F('Tính giá trị hàm số','Đề cho f(x) và yêu cầu f(a), f(a+h) hoặc giải f(x)=k.',['Thay đúng giá trị vào tất cả vị trí x.','Thực hiện lũy thừa trước, nhân chia rồi cộng trừ.','Nếu giải f(x)=k, đưa về phương trình theo x.'],'Cho f(x)=x²−3x+1. Tính f(−2).',['Thay x=−2: f(−2)=(−2)²−3(−2)+1.','Tính 4+6+1.'],'f(−2)=11.','Thay −2 nhưng quên ngoặc; nhầm (−2)² thành −4.','Cơ bản',''),
      F('Xét tính chẵn, lẻ','Đề yêu cầu xác định hàm chẵn, lẻ hoặc không chẵn không lẻ.',['Kiểm tra miền xác định có đối xứng qua 0 không.','Tính f(−x).','So sánh với f(x) và −f(x).'],'Xét f(x)=x³−2x trên ℝ.',['f(−x)=−x³+2x.','Ta có −f(x)=−x³+2x.'],'f là hàm số lẻ.','Kết luận chỉ từ hình dạng biểu thức mà không kiểm tra miền xác định.','Vận dụng',''),
      F('Xét khoảng đồng biến, nghịch biến','Đề cho bảng biến thiên, đồ thị hoặc hàm bậc hai.',['Đọc từ trái sang phải trên đồ thị: đi lên là đồng biến, đi xuống là nghịch biến.','Với y=ax²+bx+c, xét đỉnh x=−b/(2a) và chiều mở của parabol.'],'Xét chiều biến thiên của y=x² trên ℝ.',['Parabol có đỉnh tại x=0 và mở lên.','Khi x tăng từ −∞ đến 0, y giảm.','Khi x tăng từ 0 đến +∞, y tăng.'],'Nghịch biến trên (−∞;0], đồng biến trên [0;+∞).','Nhầm khoảng tăng/giảm; bỏ qua điểm biên khi đề dùng khoảng đóng.','Cơ bản',''),
      F('Đọc đồ thị và tìm giao điểm','Đề yêu cầu giao với trục, nghiệm f(x)=0 hoặc so sánh f(x), g(x).',['Giao Ox: đặt y=0, giải f(x)=0.','Giao Oy: đặt x=0.','Giao hai đồ thị: giải f(x)=g(x).'],'Tìm giao điểm của y=2x+1 với trục Oy.',['Trục Oy có x=0.','Thay vào y=2·0+1.'],'Giao điểm (0;1).','Nhầm giao Oy với Ox; quên tọa độ giao điểm cần đủ hai thành phần.','Cơ bản','')
    ],['Điều kiện xác định là bước đầu tiên.','Miền xác định phải đối xứng mới xét chẵn/lẻ.','Đọc trục và tọa độ chính xác.']),

    T('quadratic','Hàm số bậc hai và đồ thị parabol','ĐẠI SỐ','∩','Khai thác dạng y=ax²+bx+c (a≠0), đỉnh, trục đối xứng, giao điểm và bài toán tham số.',
      ['y=ax²+bx+c (a≠0).','Trục đối xứng: x=−b/(2a).','Hoành độ đỉnh: xI=−b/(2a); tung độ yI=f(xI)=−Δ/(4a).','a>0: parabol mở lên; a<0: mở xuống.','Δ=b²−4ac; nghiệm hoành độ giao Ox nếu Δ≥0.'],[
      F('Tìm đỉnh và trục đối xứng','Cho hàm bậc hai hoặc yêu cầu đưa về dạng đỉnh.',['Xác định a,b,c.','Tính xI=−b/(2a).','Tính yI=f(xI) hoặc −Δ/(4a).','Trục đối xứng là x=xI.'],'Tìm đỉnh y=x²−4x+3.',['a=1,b=−4,c=3.','xI=4/2=2.','yI=4−8+3=−1.'],'I(2;−1), trục đối xứng x=2.','Sai dấu khi tính −b; tính yI nhầm f(xI).','Cơ bản',''),
      F('Lập bảng biến thiên và phác họa parabol','Đề yêu cầu vẽ đồ thị hoặc nêu chiều biến thiên.',['Tìm đỉnh và trục đối xứng.','Xác định chiều mở qua dấu a.','Tìm giao Oy và giao Ox (nếu có).','Lấy thêm điểm đối xứng qua trục để vẽ chính xác.'],'Phác họa y=x²−4x+3.',['Đỉnh I(2;−1), mở lên.','Giao Oy: (0;3).','Nghiệm x=1 và x=3, nên giao Ox tại (1;0),(3;0).'],'Parabol mở lên, đỉnh (2;−1), trục x=2; cắt Ox tại 1 và 3.','Chỉ lấy một điểm khiến đồ thị lệch; không dùng điểm đối xứng.','Vận dụng',''),
      F('Tìm giao điểm của parabol với đường thẳng','Đề hỏi số giao điểm hoặc tọa độ giao giữa y=ax²+bx+c và y=mx+n.',['Cho hai biểu thức bằng nhau.','Chuyển về phương trình bậc hai.','Dựa vào Δ để xét số giao điểm; giải để tìm tọa độ.'],'Tìm giao điểm y=x² và y=2x+3.',['Giải x²=2x+3 ⇔ x²−2x−3=0.','(x−3)(x+1)=0 nên x=3 hoặc x=−1.','Tính y tương ứng: 9 và 1.'],'Hai giao điểm (3;9) và (−1;1).','Chỉ tìm hoành độ mà quên tính tung độ; nhầm Δ với số giao điểm khi phương trình suy biến.','Vận dụng',''),
      F('Xác định hệ số từ điều kiện','Đề cho đỉnh, điểm thuộc đồ thị, giao điểm hoặc hệ số và yêu cầu tìm a,b,c.',['Dùng dạng y=a(x−h)²+k nếu biết đỉnh (h;k).','Thay điểm thuộc đồ thị để lập phương trình tìm a.','Nếu có thêm điều kiện, kiểm tra lại các hệ số.'],'Parabol có đỉnh I(1;−2), đi qua A(0;1). Tìm hàm số.',['Dạng đỉnh: y=a(x−1)²−2.','Thay A(0;1): 1=a−2 ⇒ a=3.'],'y=3(x−1)²−2=3x²−6x+1.','Dùng dạng tổng quát với nhiều ẩn dù đã biết đỉnh; quên thay tọa độ điểm.','Nâng cao','y=a(x−h)²+k')
    ],['Luôn tìm đỉnh và trục đối xứng trước khi vẽ.','Kiểm tra dấu a để biết chiều mở.','Dùng Δ để xét giao điểm với Ox.']),

    T('quadratic-sign','Dấu tam thức bậc hai và bất phương trình bậc hai','ĐẠI SỐ','±','Xét dấu ax²+bx+c và giải bất phương trình bậc hai bằng nghiệm, biệt thức và bảng xét dấu.',
      ['Δ=b²−4ac.','Δ>0: hai nghiệm phân biệt; Δ=0: nghiệm kép; Δ<0: không có nghiệm thực.','Nếu Δ>0: tam thức cùng dấu a ở ngoài hai nghiệm, trái dấu a ở giữa.','Nếu Δ≤0: tam thức luôn cùng dấu a (bằng 0 tại nghiệm kép nếu Δ=0).'],[
      F('Tìm nghiệm và biệt thức','Đề cho tam thức ax²+bx+c và yêu cầu tính Δ, nghiệm.',['Xác định a,b,c theo đúng dấu.','Tính Δ=b²−4ac.','Áp dụng công thức nghiệm nếu Δ≥0.'],'Tìm nghiệm của x²−5x+6=0.',['a=1,b=−5,c=6.','Δ=25−24=1.','x=(5±1)/2.'],'x=2 hoặc x=3.','Sai dấu b; nhầm công thức nghiệm; quên chia 2a.','Cơ bản','Δ=b²−4ac'),
      F('Lập bảng xét dấu tam thức','Đề yêu cầu xét dấu biểu thức hoặc chọn khoảng dương/âm.',['Tìm nghiệm và sắp xếp trên trục số.','Xác định dấu ở miền ngoài theo dấu a.','Đổi dấu qua mỗi nghiệm đơn; nghiệm kép không đổi dấu.'],'Xét dấu f(x)=x²−5x+6.',['Phân tích f(x)=(x−2)(x−3).','a>0 nên dương ngoài [2;3], âm giữa hai nghiệm.','Tại x=2,3 biểu thức bằng 0.'],'f(x)>0 khi x∈(−∞;2)∪(3;+∞); f(x)<0 khi x∈(2;3).','Đưa nhầm dấu ở ngoài; quên các nghiệm là điểm bằng 0.','Cơ bản',''),
      F('Giải bất phương trình bậc hai','Có dạng ax²+bx+c ⋚ 0.',['Chuyển tất cả về một vế.','Tìm nghiệm của tam thức.','Dựa vào bảng dấu chọn khoảng phù hợp với dấu đề bài.','Chú ý dấu ≤, ≥ có lấy nghiệm hay không.'],'Giải x²−5x+6≤0.',['Nghiệm 2 và 3; hệ số a>0.','Tam thức không dương ở giữa hai nghiệm, kể cả nghiệm.'],'S=[2;3].','Chọn khoảng mở khi dấu đề bài có bằng; quên xét trường hợp Δ≤0.','Cơ bản',''),
      F('Tìm tham số để tam thức luôn dương/không âm','Đề yêu cầu ax²+bx+c>0 hoặc ≥0 với mọi x.',['Xét dấu hệ số a.','Với a>0, để tam thức ≥0 với mọi x cần Δ≤0.','Để tam thức >0 với mọi x cần a>0 và Δ<0.','Thay tham số và giải bất phương trình.'],'Tìm m để x²−2x+m≥0 với mọi x∈ℝ.',['a=1>0.','Δ=(−2)²−4m=4−4m.','Cần Δ≤0 ⇒ m≥1.'],'m≥1.','Dùng Δ<0 cho điều kiện không âm; không xét dấu a.','Nâng cao','a>0, Δ≤0 ⇒ ax²+bx+c≥0 ∀x')
    ],['Đừng bỏ qua hệ số a.','Nghiệm kép không làm đổi dấu.','Phân biệt > với ≥ khi chọn khoảng.']),

    T('equations','Phương trình quy về phương trình bậc hai','ĐẠI SỐ','x²','Nhận diện các phương trình có thể đặt ẩn phụ, bình phương có điều kiện hoặc rút gọn để đưa về bậc hai.',
      ['Phương trình trùng phương: ax⁴+bx²+c=0, đặt t=x²≥0.','Khi bình phương hai vế, phải ghi điều kiện và thử lại nghiệm.','Phương trình hữu tỉ: điều kiện mẫu khác 0.','Sau biến đổi tương đương, đối chiếu điều kiện ban đầu.'],[
      F('Phương trình trùng phương','Có dạng ax⁴+bx²+c=0.',['Đặt t=x² với điều kiện t≥0.','Giải phương trình bậc hai theo t.','Giữ nghiệm t≥0 rồi suy ra x=±√t.'],'Giải x⁴−5x²+4=0.',['Đặt t=x²≥0: t²−5t+4=0.','(t−1)(t−4)=0 ⇒ t=1 hoặc 4.','Suy ra x²=1 hoặc x²=4.'],'S={−2;−1;1;2}.','Quên điều kiện t≥0; chỉ lấy căn dương mà thiếu nghiệm âm.','Vận dụng',''),
      F('Phương trình chứa căn đưa về bậc hai','Có căn bậc hai và có thể cô lập căn trước khi bình phương.',['Tìm điều kiện để căn thức có nghĩa.','Cô lập căn và kiểm tra vế còn lại không âm.','Bình phương hai vế.','Giải phương trình thu được và thử lại nghiệm vào đề gốc.'],'Giải √(x+1)=x−1.',['Điều kiện x≥1.','Bình phương: x+1=(x−1)².','Suy ra x²−3x=0 ⇒ x=0 hoặc x=3.','Đối chiếu điều kiện x≥1, chỉ nhận x=3.'],'S={3}.','Bình phương khi chưa cô lập căn; không thử lại nên nhận nghiệm ngoại lai.','Nâng cao','√A=B ⇒ A=B², kèm A≥0 và B≥0'),
      F('Phương trình phân thức rút gọn','Có phân thức chứa đa thức bậc hai hoặc nhân tử có thể rút gọn.',['Ghi điều kiện mẫu khác 0.','Phân tích tử và mẫu thành nhân tử.','Rút gọn nhưng giữ điều kiện cấm.','Giải phương trình còn lại và loại nghiệm vi phạm.'],'Giải (x²−1)/(x−1)=3.',['Điều kiện x≠1.','x²−1=(x−1)(x+1), nên với x≠1 biểu thức bằng x+1.','x+1=3 ⇒ x=2, thỏa điều kiện.'],'S={2}.','Rút gọn rồi quên điều kiện x≠1; nhân chéo mà chưa xét mẫu.','Vận dụng',''),
      F('Phương trình chứa giá trị tuyệt đối (mở rộng)','Có |A(x)| và có thể bình phương hoặc chia trường hợp.',['Xét A(x)≥0 và A(x)<0.','Bỏ dấu giá trị tuyệt đối theo từng trường hợp.','Giải từng phương trình, giữ điều kiện tương ứng.','Hợp các nghiệm hợp lệ.'],'Giải |x−2|=3.',['Trường hợp x−2≥0: x−2=3 ⇒ x=5.','Trường hợp x−2<0: −(x−2)=3 ⇒ x=−1.'],'S={−1;5}.','Bỏ một trường hợp; chia trường hợp nhưng quên điều kiện đi kèm.','Mở rộng','|A|=k (k≥0) ⇔ A=k hoặc A=−k')
    ],['Ghi điều kiện trước biến đổi.','Đặt ẩn phụ phải kèm miền giá trị.','Thử nghiệm vào phương trình gốc.']),

    T('triangle','Hệ thức lượng trong tam giác','HÌNH HỌC','△','Dùng giá trị lượng giác góc 0°–180°, định lí sin, côsin và công thức diện tích để giải tam giác.',
      ['a/sin A=b/sin B=c/sin C=2R.','a²=b²+c²−2bc cos A.','S=½bc sin A=½ab sin C=½ac sin B.','S=abc/(4R)=pr (p là nửa chu vi, r bán kính nội tiếp).','Tổng ba góc A+B+C=180°.'],[
      F('Tính cạnh bằng định lí côsin','Biết hai cạnh và góc xen giữa hoặc ba cạnh.',['Xác định cạnh đối diện góc đã biết.','Thay vào a²=b²+c²−2bc cos A.','Lấy căn dương vì cạnh là độ dài.'],'Cho b=7, c=8, A=60°. Tính a.',['a²=7²+8²−2·7·8·cos60°.','a²=49+64−56=57.'],'a=√57.','Nhầm cạnh đối diện góc; quên bình phương hoặc lấy nghiệm âm.','Cơ bản',''),
      F('Tính cạnh hoặc góc bằng định lí sin','Có một cặp cạnh–góc đối diện và thêm một góc/cạnh khác.',['Ghép đúng cặp cạnh và góc đối diện.','Lập tỉ lệ a/sin A=b/sin B.','Giải ẩn; khi tìm góc cần kiểm tra tổng góc tam giác.'],'Cho a=6, A=30°, B=45°. Tính b.',['b/sin45°=6/sin30°.','b=6·(√2/2)/(1/2).'],'b=6√2.','Ghép nhầm cạnh với góc không đối diện; máy tính đang ở radian khi nhập độ.','Cơ bản',''),
      F('Tính diện tích tam giác','Biết hai cạnh và góc xen giữa, hoặc ba cạnh, hoặc bán kính.',['Chọn công thức phù hợp dữ kiện.','Nếu biết hai cạnh và góc xen giữa, dùng S=½ab sin C.','Nếu biết ba cạnh, dùng công thức Heron.','Kiểm tra đơn vị diện tích.'],'Cho a=7,b=8,C=60°. Tính S.',['S=½·7·8·sin60°.','sin60°=√3/2.'],'S=14√3 (đơn vị diện tích).','Dùng góc không xen giữa hai cạnh; quên hệ số 1/2.','Cơ bản',''),
      F('Tính góc bằng định lí côsin','Biết ba cạnh và yêu cầu tìm một góc.',['Chọn công thức cho góc cần tìm.','Biến đổi cos A=(b²+c²−a²)/(2bc).','Dùng arccos hoặc giá trị lượng giác đặc biệt.'],'Tam giác có a=5,b=7,c=8. Tính cos C.',['cos C=(a²+b²−c²)/(2ab).','=(25+49−64)/(2·5·7).'],'cos C=1/7.','Lấy cạnh đối diện sai góc; đặt mẫu là 2ac thay vì 2ab.','Vận dụng','cos C=(a²+b²−c²)/(2ab)'),
      F('Giải bài toán thực tế bằng hệ thức lượng','Bài toán đo chiều cao, khoảng cách không đo trực tiếp.',['Vẽ hình và xác định tam giác mô hình.','Đánh dấu cạnh, góc đã biết.','Chọn định lí sin/côsin hoặc công thức diện tích.','Kết luận kèm đơn vị và mức độ làm tròn.'],'Hai điểm A,B cách nhau 50 m; góc nhìn đến đỉnh cột từ A là 35°, từ B là 50° trong tam giác với chân cột C. Tính chiều cao cột (dạng mô hình).',['Gọi h là chiều cao, khoảng cách ngang từ A đến C là d.','Trong tam giác vuông tại C: tan35°=h/d; tan50°=h/(50−d).','Giải hai biểu thức để tìm h (cần xác định đúng cấu hình thực tế).'],'Cần mô hình hình học và dữ kiện vị trí chính xác trước khi tính số.','Tự giả định chân cột nằm giữa hai điểm khi đề không nói; nhầm góc nâng với góc trong tam giác.','Nâng cao','Tùy sơ đồ: tan θ = đối/kề')
    ],['Đặt đúng tên cạnh đối diện góc.','Kiểm tra máy tính ở chế độ DEG.','Vẽ hình trước khi thay số.']),

    T('vectors','Vectơ và các phép toán vectơ','HÌNH HỌC','→','Biểu diễn vectơ, cộng trừ, nhân vectơ với số, chứng minh thẳng hàng và dùng tích vô hướng.',
      ['AB⃗ + BC⃗ = AC⃗.','AB⃗ = −BA⃗; AB⃗ = b⃗−a⃗ nếu A,B có vectơ vị trí a⃗,b⃗.','|u⃗|=√(u⃗·u⃗).','u⃗·v⃗=|u⃗||v⃗|cos(u⃗,v⃗).','u⃗⊥v⃗ ⇔ u⃗·v⃗=0.','u⃗,v⃗ cùng phương ⇔ tồn tại k: u⃗=kv⃗.'],[
      F('Cộng và trừ vectơ','Đề yêu cầu rút gọn biểu thức vectơ hoặc tính tổng theo quy tắc hình tam giác.',['Dùng quy tắc ba điểm: AB⃗+BC⃗=AC⃗.','Dùng quy tắc hình bình hành khi hai vectơ chung gốc.','Khi trừ, đổi thành cộng vectơ đối.'],'Rút gọn AB⃗+BC⃗+CD⃗.',['AB⃗+BC⃗=AC⃗.','AC⃗+CD⃗=AD⃗.'],'Kết quả AD⃗.','Nối sai điểm đầu–cuối; nhầm AB⃗ với BA⃗.','Cơ bản',''),
      F('Nhân vectơ với một số và cùng phương','Có biểu thức k·a⃗, yêu cầu chứng minh ba điểm thẳng hàng hoặc hai vectơ cùng phương.',['Xác định hệ số k.','Nếu u⃗=kv⃗ thì u⃗,v⃗ cùng phương.','Muốn chứng minh A,B,C thẳng hàng, chứng minh AB⃗=kAC⃗.'],'u⃗=(2;4), v⃗=(1;2). Hai vectơ có cùng phương không?',['Ta có u⃗=2v⃗.'],'Có, u⃗ và v⃗ cùng phương.','So sánh riêng từng tọa độ nhưng không dùng cùng một hệ số.','Cơ bản',''),
      F('Tích vô hướng và góc giữa hai vectơ','Đề hỏi góc giữa vectơ, vuông góc hoặc tích vô hướng.',['Tính tích vô hướng theo tọa độ hoặc hình học.','Tính độ dài hai vectơ.','Dùng cosθ=(u⃗·v⃗)/(|u⃗||v⃗|).','Nếu tích vô hướng bằng 0 và hai vectơ khác 0 thì vuông góc.'],'u⃗=(2;−1), v⃗=(1;2). Tính u⃗·v⃗.',['u⃗·v⃗=2·1+(−1)·2.'],'0, nên hai vectơ vuông góc.','Quên nhân các tọa độ tương ứng; kết luận góc 90° khi một vectơ bằng vectơ-không.','Vận dụng','u⃗·v⃗=x₁x₂+y₁y₂'),
      F('Biểu diễn vectơ theo hai vectơ không cùng phương','Đề cho tam giác/hình bình hành và yêu cầu biểu diễn vectơ theo hai vectơ cơ sở.',['Chọn hai vectơ không cùng phương làm cơ sở.','Phân tích đường đi qua các điểm trung gian.','Dùng quy tắc hình bình hành hoặc tọa độ affine để tìm hệ số.'],'Trong tam giác ABC, M là trung điểm BC. Biểu diễn AM⃗ theo AB⃗, AC⃗.',['Vì M là trung điểm BC nên vectơ vị trí m=(b+c)/2.','AM⃗=m−a=(AB⃗+AC⃗)/2.'],'AM⃗=½AB⃗+½AC⃗.','Nhầm trung điểm với trọng tâm; quên hệ số 1/2.','Nâng cao','AM⃗=½(AB⃗+AC⃗)'),
      F('Chứng minh đẳng thức vectơ hình học','Bài yêu cầu chứng minh hệ thức trong tam giác, hình bình hành, trung điểm, trọng tâm.',['Chọn điểm gốc thuận tiện hoặc dùng quy tắc ba điểm.','Thay vectơ qua các điểm trung gian.','Biến đổi hai vế về cùng biểu thức.'],'M,N lần lượt là trung điểm AB, AC. Chứng minh MN⃗=½BC⃗.',['MN⃗=MA⃗+AB⃗+BN⃗ (hoặc dùng tọa độ vectơ vị trí).','Với m=(a+b)/2, n=(a+c)/2 thì MN⃗=n−m=(c−b)/2.'],'MN⃗=½BC⃗.','Dùng hình vẽ thay cho lập luận; nhầm hướng vectơ MN⃗ với NM⃗.','Nâng cao','')
    ],['Giữ đúng hướng mũi tên.','Phân biệt vectơ cùng phương và bằng nhau.','Tích vô hướng bằng 0 cần hai vectơ khác vectơ-không để kết luận vuông góc.']),

    T('coordinate-vector','Tọa độ vectơ trong mặt phẳng','HÌNH HỌC','(x;y)','Chuyển bài toán hình học vectơ sang tọa độ để tính độ dài, trung điểm, trọng tâm, cùng phương và góc.',
      ['Nếu A(xA;yA), B(xB;yB) thì AB⃗=(xB−xA;yB−yA).','|u⃗|=√(x²+y²).','u⃗·v⃗=x₁x₂+y₁y₂.','M trung điểm AB: M((xA+xB)/2;(yA+yB)/2).','G trọng tâm ABC: G((xA+xB+xC)/3;(yA+yB+yC)/3).'],[
      F('Tìm tọa độ vectơ AB','Biết tọa độ A và B, yêu cầu tính AB⃗ hoặc tìm điểm còn thiếu.',['Lấy tọa độ điểm cuối trừ tọa độ điểm đầu.','Viết đúng thứ tự hoành độ, tung độ.','Nếu biết AB⃗ và A, suy ra B=A+AB⃗.'],'A(1;2), B(4;6). Tìm AB⃗.',['x=4−1=3.','y=6−2=4.'],'AB⃗=(3;4).','Trừ ngược B−A thành A−B; đảo hoành và tung độ.','Cơ bản',''),
      F('Tính độ dài vectơ hoặc đoạn thẳng','Có tọa độ vectơ hoặc hai đầu mút.',['Tìm tọa độ vectơ nếu đề cho hai điểm.','Dùng căn tổng bình phương hai tọa độ.'],'A(1;2), B(4;6). Tính AB.',['AB⃗=(3;4).','AB=√(3²+4²).'],'AB=5.','Quên lấy căn; tính hiệu tọa độ sai dấu nhưng bình phương có thể che lỗi.','Cơ bản',''),
      F('Tìm trung điểm và trọng tâm','Đề cho tọa độ đỉnh/đầu mút và hỏi trung điểm hoặc trọng tâm.',['Trung điểm: lấy trung bình cộng từng tọa độ.','Trọng tâm tam giác: lấy trung bình cộng ba hoành độ và ba tung độ.'],'A(1;2), B(5;4). Tìm trung điểm M.',['xM=(1+5)/2=3.','yM=(2+4)/2=3.'],'M(3;3).','Cộng hoành độ với tung độ; dùng mẫu 3 cho trung điểm.','Cơ bản',''),
      F('Kiểm tra cùng phương, vuông góc','Đề cho hai vectơ tọa độ và yêu cầu nhận xét.',['Cùng phương: x₁y₂−x₂y₁=0.','Vuông góc: x₁x₂+y₁y₂=0.'],'u⃗=(2;4), v⃗=(1;2). Kiểm tra cùng phương.',['2·2−4·1=0.'],'Hai vectơ cùng phương.','Dùng tích vô hướng để kiểm tra cùng phương; dùng định thức để kiểm tra vuông góc.','Vận dụng','')
    ],['Tọa độ AB⃗ = B−A.','Trung điểm chia 2, trọng tâm chia 3.','Dùng định thức cho cùng phương và tích vô hướng cho vuông góc.']),

    T('statistics-center','Các số đặc trưng đo xu thế trung tâm','THỐNG KÊ','μ','Tóm tắt dữ liệu bằng số trung bình, trung vị, tứ phân vị và mốt; lưu ý quy ước tứ phân vị theo sách/giáo viên.',
      ['Số trung bình: x̄=(x₁+…+xₙ)/n; có tần số: x̄=Σnᵢxᵢ/N.','Trung vị Me: giá trị giữa của dãy đã sắp xếp.','Mốt Mo: giá trị có tần số lớn nhất.','Tứ phân vị Q₁,Q₂,Q₃ chia dãy đã sắp xếp thành bốn phần.'],[
      F('Tính số trung bình','Đề yêu cầu giá trị trung bình của mẫu số liệu hoặc bảng tần số.',['Cộng các giá trị và chia số phần tử.','Với bảng tần số, nhân mỗi giá trị với tần số rồi cộng.','Chia cho tổng tần số N.'],'Dữ liệu 5,7,8,10. Tính số trung bình.',['Tổng=5+7+8+10=30.','Có 4 số liệu nên x̄=30/4.'],'x̄=7,5.','Chia cho số lượng giá trị phân biệt thay vì tổng tần số.','Cơ bản',''),
      F('Tìm trung vị','Số liệu cần được sắp xếp tăng dần; đề hỏi Me.',['Sắp xếp dãy không giảm.','n lẻ: lấy số ở vị trí (n+1)/2.','n chẵn: trung bình hai số ở vị trí n/2 và n/2+1.'],'Tìm trung vị của 2,9,4,6,10.',['Sắp xếp: 2,4,6,9,10.','Có 5 số, lấy số thứ 3.'],'Me=6.','Tính trung vị trước khi sắp xếp; nhầm trung vị với trung bình.','Cơ bản',''),
      F('Tìm mốt','Đề hỏi giá trị xuất hiện nhiều nhất trong mẫu số liệu.',['Đếm tần số từng giá trị.','Chọn giá trị có tần số lớn nhất.','Có thể có nhiều mốt hoặc không có mốt nổi bật.'],'Dãy 2,3,3,4,4,4,5 có mốt là gì?',['Tần số 2:1; 3:2; 4:3; 5:1.','Giá trị 4 xuất hiện nhiều nhất.'],'Mo=4.','Chọn giá trị lớn nhất thay vì giá trị có tần số lớn nhất.','Cơ bản',''),
      F('Tính tứ phân vị','Đề yêu cầu Q₁,Q₂,Q₃ của dãy không ghép nhóm.',['Sắp xếp dãy tăng dần.','Q₂ là trung vị toàn bộ mẫu.','Tìm trung vị nửa dưới và nửa trên theo quy ước đang học.','Ghi rõ quy ước nếu số phần tử lẻ.'],'Dãy 1,2,3,4,5,6,7,8,9. Tìm Q₁,Q₂,Q₃ theo cách chia đôi bỏ trung vị.',['Q₂=5.','Nửa dưới 1,2,3,4 có trung vị 2,5.','Nửa trên 6,7,8,9 có trung vị 7,5.'],'Q₁=2,5; Q₂=5; Q₃=7,5.','Không sắp xếp; áp dụng khác quy ước của lớp mà không nói rõ.','Vận dụng','')
    ],['Luôn sắp xếp dữ liệu khi tìm trung vị/tứ phân vị.','Phân biệt trung bình, trung vị và mốt.','Kiểm tra quy ước tứ phân vị mà lớp đang sử dụng.']),

    T('statistics-spread','Các số đặc trưng đo độ phân tán','THỐNG KÊ','σ','Đánh giá độ biến động của dữ liệu bằng khoảng biến thiên, khoảng tứ phân vị, phương sai và độ lệch chuẩn.',
      ['R=max−min.','ΔQ=Q₃−Q₁.','Phương sai s²=(1/n)Σ(xᵢ−x̄)².','Độ lệch chuẩn s=√s².','Với bảng tần số: s²=(1/N)Σnᵢ(xᵢ−x̄)².'],[
      F('Tính khoảng biến thiên','Đề hỏi độ rộng toàn bộ mẫu dữ liệu.',['Tìm giá trị lớn nhất.','Tìm giá trị nhỏ nhất.','Lấy hiệu lớn nhất trừ nhỏ nhất.'],'Tính R của 3,5,8,10.',['Max=10, min=3.','R=10−3.'],'R=7.','Lấy max+min hoặc quên sắp xếp để xác định hai đầu.','Cơ bản',''),
      F('Tính khoảng tứ phân vị','Đề cho Q₁,Q₃ hoặc yêu cầu mức phân tán của 50% dữ liệu giữa.',['Tính Q₁ và Q₃.','Lấy Q₃−Q₁.'],'Nếu Q₁=2,5 và Q₃=7,5 thì ΔQ bằng bao nhiêu?',['ΔQ=Q₃−Q₁=7,5−2,5.'],'ΔQ=5.','Lấy Q₁−Q₃; nhầm khoảng tứ phân vị với khoảng biến thiên.','Cơ bản',''),
      F('Tính phương sai và độ lệch chuẩn','Đề cho danh sách số liệu hoặc bảng tần số.',['Tính số trung bình x̄.','Tính bình phương độ lệch (xᵢ−x̄)² cho từng giá trị.','Cộng và chia cho n (hoặc tổng tần số).','Lấy căn phương sai để có độ lệch chuẩn.'],'Tính phương sai của mẫu 2,4,6 (chia cho n).',['x̄=(2+4+6)/3=4.','Các bình phương độ lệch: 4,0,4.','s²=(4+0+4)/3.'],'s²=8/3; s=√(8/3).','Chia cho n−1 khi bài yêu cầu công thức mô tả mẫu trong SGK đang dùng chia n; quên bình phương độ lệch.','Vận dụng',''),
      F('So sánh độ phân tán hai mẫu','Đề có hai nhóm dữ liệu và hỏi nhóm nào đồng đều hơn.',['Tính cùng một chỉ số phân tán cho hai mẫu.','Nếu cùng đơn vị và thang đo, chỉ số nhỏ hơn thường thể hiện ít phân tán hơn.','Xem xét ngoại lệ và quy mô mẫu để tránh kết luận quá mức.'],'Nhóm A có R=4, nhóm B có R=9. Nhóm nào ít phân tán hơn theo khoảng biến thiên?',['So sánh 4 và 9.','4<9 nên nhóm A có khoảng biến thiên nhỏ hơn.'],'Nhóm A ít phân tán hơn theo chỉ số R.','So sánh hai chỉ số khác loại; kết luận về toàn bộ phân phối chỉ từ một chỉ số.','Vận dụng','')
    ],['Nêu rõ đang dùng chỉ số phân tán nào.','Độ lệch chuẩn cùng đơn vị với dữ liệu; phương sai mang đơn vị bình phương.','Không suy luận quá mức chỉ từ một chỉ số.']),


    T('statistics-data','Số gần đúng, sai số và mô tả dữ liệu','THỐNG KÊ','▥','Đọc, tổ chức và biểu diễn dữ liệu; hiểu số gần đúng, độ chính xác, sai số và cách làm tròn.',
      ['Sai số tuyệt đối: Δa=|a−ā| (ā là giá trị đúng, a là giá trị gần đúng).','Nếu số gần đúng a có độ chính xác d thì giá trị đúng nằm trong [a−d;a+d].','Sai số tương đối: δ=Δa/|ā| (thường biểu diễn theo %).','Tần suất fᵢ=nᵢ/N; tổng các tần suất bằng 1 (hoặc 100%).'],[
      F('Đọc bảng tần số và tần suất','Đề cho bảng giá trị xᵢ và tần số nᵢ.',['Tính tổng số quan sát N=Σnᵢ.','Tần suất của giá trị i là fᵢ=nᵢ/N.','Kiểm tra tổng tần suất bằng 1 hoặc 100%.'],'Một giá trị xuất hiện 8 lần trong mẫu 40 quan sát. Tần suất của nó là bao nhiêu?',['nᵢ=8, N=40.','fᵢ=8/40=0,2.'],'Tần suất là 0,2 hay 20%.','Lấy N/nᵢ; quên đổi sang phần trăm khi đề yêu cầu.','Cơ bản','fᵢ=nᵢ/N'),
      F('Chọn và đọc biểu đồ dữ liệu','Đề yêu cầu mô tả dữ liệu hoặc so sánh nhóm trên biểu đồ cột, đoạn thẳng, hình quạt.',['Đọc tiêu đề, đơn vị và chú giải.','Xác định trục biểu diễn biến nào và thang đo.','Đọc giá trị đúng tại cột/điểm/miếng quạt.','So sánh xu hướng, lớn nhất/nhỏ nhất và nêu nhận xét có căn cứ.'],'Biểu đồ cột có số sách đọc của ba lớp lần lượt là 24, 30, 18 quyển. Lớp nào đọc nhiều nhất?',['So sánh ba giá trị 24,30,18.','Giá trị lớn nhất là 30.'],'Lớp thứ hai đọc nhiều nhất, với 30 quyển.','Đọc nhầm trục hoặc thang chia; nêu kết luận không có số liệu hỗ trợ.','Cơ bản',''),
      F('Tính sai số tuyệt đối','Đề cho giá trị đúng và số gần đúng, hoặc cho khoảng sai số.',['Xác định giá trị đúng ā và gần đúng a.','Tính Δa=|a−ā|.','Ghi đơn vị của sai số.'],'Giá trị đúng là 12,5 cm; số đo gần đúng là 12,4 cm. Sai số tuyệt đối?',['Δa=|12,4−12,5|.'],'Δa=0,1 cm.','Quên trị tuyệt đối; nhầm sai số tuyệt đối với sai số tương đối.','Cơ bản','Δa=|a−ā|'),
      F('Làm tròn số theo độ chính xác','Đề yêu cầu làm tròn đến hàng phần mười, hàng phần trăm hoặc độ chính xác d.',['Xác định hàng cần làm tròn.','Quan sát chữ số ngay bên phải hàng đó.','Nếu chữ số này từ 5 trở lên thì tăng 1 ở hàng làm tròn; nếu nhỏ hơn 5 thì giữ nguyên.','Bỏ các chữ số phía sau và nêu quy tắc đã dùng.'],'Làm tròn 3,746 đến hàng phần trăm.',['Hàng phần trăm là chữ số 4.','Chữ số ngay sau là 6≥5 nên tăng 4 thành 5.'],'3,75.','Nhìn chữ số xa hơn; làm tròn nhiều lần gây sai số tích lũy.','Cơ bản',''),
      F('Lập bảng phân bố tần số','Đề cho dữ liệu thô và yêu cầu tóm tắt thành bảng.',['Liệt kê các giá trị khác nhau hoặc các nhóm lớp.','Đếm số lần xuất hiện của mỗi giá trị để có tần số.','Tính tần suất nếu cần.','Kiểm tra tổng tần số bằng cỡ mẫu.'],'Dữ liệu 1,2,2,3,3,3 có tần số của giá trị 3 là bao nhiêu?',['Đếm số lần số 3 xuất hiện.','Có ba lần.'],'Tần số của 3 là 3.','Bỏ sót một giá trị khi đếm; tổng tần số không bằng cỡ mẫu.','Vận dụng','N=Σnᵢ')
    ],['Kiểm tra đơn vị, trục và chú giải trước khi đọc biểu đồ.','Tần suất = tần số chia tổng số quan sát.','Sai số tuyệt đối luôn không âm.']),

    T('counting','Quy tắc đếm, hoán vị, chỉnh hợp, tổ hợp','ĐẠI SỐ TỔ HỢP','n!','Đếm số cách thực hiện công việc, sắp xếp và chọn nhóm; xác định thứ tự có quan trọng hay không.',
      ['Quy tắc cộng: các phương án loại trừ nhau, tổng số cách m+n.','Quy tắc nhân: công việc gồm các bước liên tiếp, tích số cách.','n!=1·2·…·n; 0!=1.','Aₙᵏ=n!/(n−k)! (chọn k và có thứ tự).','Cₙᵏ=n!/[k!(n−k)!] (chọn k không xét thứ tự).'],[
      F('Quy tắc cộng và quy tắc nhân','Đề mô tả chọn một trong nhiều loại hoặc thực hiện nhiều bước.',['Hỏi các lựa chọn là “hoặc” loại trừ nhau hay các bước “và”.','“Hoặc” dùng cộng nếu các trường hợp không trùng.','“Và” theo các bước liên tiếp dùng nhân.'],'Có 3 áo và 2 quần. Chọn một bộ gồm 1 áo và 1 quần có bao nhiêu cách?',['Chọn áo có 3 cách.','Với mỗi áo, chọn quần có 2 cách.','Áp dụng quy tắc nhân: 3·2.'],'6 cách.','Dùng phép cộng cho hai bước liên tiếp; quên điều kiện trùng lặp giữa các nhóm lựa chọn.','Cơ bản',''),
      F('Hoán vị của n phần tử','Sắp xếp tất cả n phần tử phân biệt theo hàng hoặc thứ tự.',['Xác định có dùng tất cả n phần tử không.','Thứ tự khác nhau được tính là cách khác nhau.','Dùng Pₙ=n!.'],'Có 5 học sinh xếp thành một hàng. Có bao nhiêu cách?',['Sắp xếp cả 5 học sinh phân biệt.','P₅=5!=120.'],'120 cách.','Dùng chỉnh hợp khi đã dùng hết phần tử; quên phần tử phân biệt.','Cơ bản','Pₙ=n!'),
      F('Chỉnh hợp chập k của n','Chọn k phần tử từ n phần tử và có phân biệt thứ tự/vai trò.',['Xác định chọn k trong n.','Kiểm tra thứ tự có quan trọng không.','Nếu có, dùng Aₙᵏ=n!/(n−k)!.'],'Từ 6 bạn chọn lớp trưởng và lớp phó. Có bao nhiêu cách?',['Có 6 cách chọn lớp trưởng.','Còn 5 cách chọn lớp phó.'],'A₆²=6·5=30 cách.','Dùng tổ hợp khi các vai trò khác nhau; không giảm số lựa chọn sau mỗi lần chọn.','Vận dụng','Aₙᵏ=n!/(n−k)!'),
      F('Tổ hợp chập k của n','Chọn một nhóm k phần tử, không phân biệt thứ tự.',['Xác định nhóm có vai trò như nhau.','Dùng Cₙᵏ=n!/[k!(n−k)!].','Kiểm tra 0≤k≤n.'],'Chọn 2 bạn từ 5 bạn để trực nhật. Có bao nhiêu cách?',['Thứ tự không quan trọng.','C₅²=5!/(2!3!)=10.'],'10 cách.','Tính AB và BA là hai trường hợp khác nhau; nhầm tổ hợp với chỉnh hợp.','Cơ bản','Cₙᵏ=n!/[k!(n−k)!]'),
      F('Đếm có điều kiện / chia trường hợp','Đề có yêu cầu đứng cạnh nhau, không đứng cạnh nhau, ít nhất một, đúng k…',['Chia thành các trường hợp loại trừ nhau.','Với điều kiện “đứng cạnh”, có thể gộp thành một khối.','Với “ít nhất một”, thường dùng tổng số trừ trường hợp không có.','Kiểm tra các trường hợp đã đủ và không đếm trùng.'],'Có 4 bạn A,B,C,D xếp hàng; A và B phải đứng cạnh nhau. Có bao nhiêu cách?',['Gộp AB thành một khối: có 3 đối tượng để xếp, 3! cách.','Trong khối, AB có 2 thứ tự: AB hoặc BA.'],'3!·2=12 cách.','Quên đổi thứ tự trong khối; chia trường hợp chồng lấn.','Nâng cao','Đếm bù: tổng số − số trường hợp đối lập')
    ],['Hỏi “thứ tự có quan trọng không?” trước khi chọn công thức.','Tách quy tắc cộng và nhân.','Đọc kỹ điều kiện “ít nhất”, “đúng”, “liên tiếp”.']),

    T('binomial','Nhị thức Newton','CHUYÊN ĐỀ MỞ RỘNG','Σ','Khai triển (a+b)ⁿ, tìm số hạng tổng quát và hệ số của một lũy thừa.',
      ['(a+b)ⁿ=Σ(k=0→n) Cₙᵏ aⁿ⁻ᵏbᵏ.','Số hạng tổng quát Tₖ₊₁=Cₙᵏaⁿ⁻ᵏbᵏ.','Cₙᵏ=Cₙⁿ⁻ᵏ.','Tổng các hệ số của (a+b)ⁿ khi a=b=1 là 2ⁿ.'],[
      F('Khai triển nhị thức bậc nhỏ','Đề yêu cầu khai triển (a+b)², ³, ⁴.',['Xác định n.','Viết hệ số theo hàng Pascal hoặc Cₙᵏ.','Giảm số mũ của a, tăng số mũ của b qua từng số hạng.'],'Khai triển (x+2)³.',['Dùng hằng đẳng thức a³+3a²b+3ab²+b³.','Thay a=x, b=2.'],'x³+6x²+12x+8.','Sai hệ số giữa; tăng/giảm số mũ không đúng quy luật.','Cơ bản',''),
      F('Tìm số hạng tổng quát','Đề yêu cầu số hạng thứ k hoặc viết số hạng chứa x^m.',['Viết Tₖ₊₁=Cₙᵏaⁿ⁻ᵏbᵏ.','Thay a,b đúng biểu thức.','Thu gọn lũy thừa để đối chiếu số mũ đề bài.'],'Viết số hạng tổng quát của (2x−1)⁴.',['Tₖ₊₁=C₄ᵏ(2x)⁴⁻ᵏ(−1)ᵏ.'],'Tₖ₊₁=C₄ᵏ·2⁴⁻ᵏ·(−1)ᵏ·x⁴⁻ᵏ, k=0,…,4.','Dùng k thay cho k+1 sai vị trí; quên dấu âm của b.','Vận dụng',''),
      F('Tìm hệ số của x^m','Đề hỏi hệ số chứa một lũy thừa cụ thể trong khai triển.',['Viết số hạng tổng quát.','Giải điều kiện số mũ của x bằng m.','Thay k vào hệ số tổ hợp và các hệ số số học.'],'Tìm hệ số x² trong (2x−1)⁴.',['Tₖ₊₁=C₄ᵏ(2x)⁴⁻ᵏ(−1)ᵏ.','Cần 4−k=2 ⇒ k=2.','Hệ số=C₄²·2²·(−1)².'],'24.','Chỉ lấy Cₙᵏ mà quên hệ số trong a,b; nhầm số mũ x.','Vận dụng','')
    ],['Viết số hạng tổng quát trước.','Theo dõi dấu âm và số mũ.','Hệ số không bao gồm biến x.']),

    T('probability','Xác suất theo định nghĩa cổ điển','XÁC SUẤT','P(A)','Mô tả không gian mẫu, biến cố và tính xác suất khi các kết quả đồng khả năng.',
      ['P(A)=n(A)/n(Ω), khi các kết quả đồng khả năng.','0≤P(A)≤1; P(Ω)=1; P(∅)=0.','P(Ā)=1−P(A).','P(A∪B)=P(A)+P(B)−P(A∩B).','Nếu A,B xung khắc: P(A∪B)=P(A)+P(B).'],[
      F('Liệt kê không gian mẫu','Đề có tung đồng xu, gieo xúc xắc, rút thẻ hoặc chọn ngẫu nhiên.',['Xác định một kết quả sơ cấp.','Liệt kê hoặc dùng quy tắc đếm để xác định Ω.','Kiểm tra các kết quả có đồng khả năng không.'],'Tung một đồng xu hai lần. Viết không gian mẫu.',['Mỗi lần có hai khả năng S (sấp) hoặc N (ngửa).','Ghép kết quả lần 1 và lần 2.'],'Ω={SS,SN,NS,NN}, có 4 kết quả.','Bỏ sót thứ tự khi hai lần thử khác nhau; gộp SN và NS.','Cơ bản',''),
      F('Tính xác suất biến cố cổ điển','Đề hỏi xác suất lấy được số chẵn, tổng bằng…, có đặc điểm…',['Xác định Ω và n(Ω).','Mô tả biến cố A.','Đếm n(A).','Tính n(A)/n(Ω) và rút gọn.'],'Gieo một xúc xắc cân đối. Xác suất ra số chẵn?',['Ω={1,2,3,4,5,6}, n(Ω)=6.','A={2,4,6}, n(A)=3.'],'P(A)=3/6=1/2.','Đếm số phần tử thuận lợi sai; dùng xác suất khi kết quả không đồng khả năng.','Cơ bản',''),
      F('Dùng biến cố đối','Đề có cụm “ít nhất một”, “không có”, hoặc đếm trực tiếp phức tạp.',['Xác định biến cố đối Ā.','Tính P(Ā) dễ hơn.','Dùng P(A)=1−P(Ā).'],'Gieo xúc xắc một lần. Xác suất không ra số 6?',['A là biến cố không ra 6.','Biến cố đối là ra 6, có xác suất 1/6.'],'P(A)=1−1/6=5/6.','Tính trực tiếp dài dòng; lấy nhầm biến cố đối.','Vận dụng','P(A)=1−P(Ā)'),
      F('Xác suất hợp của hai biến cố','Đề hỏi A hoặc B, có hai biến cố có thể giao nhau.',['Xác định A∩B và A∪B.','Nếu có giao nhau, trừ phần bị đếm hai lần.','Nếu xung khắc, giao rỗng nên xác suất hợp bằng tổng.'],'Một lá bài được chọn từ {1,…,10}. A: số chẵn; B: số lớn hơn 7. Tính P(A∪B).',['A={2,4,6,8,10}; B={8,9,10}.','A∩B={8,10}; A∪B có 6 phần tử.'],'P(A∪B)=6/10=3/5.','Cộng xác suất hai biến cố mà không trừ giao.','Vận dụng','P(A∪B)=P(A)+P(B)−P(A∩B)')
    ],['Đồng khả năng là điều kiện của công thức cổ điển.','Liệt kê Ω không bỏ sót và không trùng.','Với “ít nhất một”, thử xét biến cố đối.']),

    T('line','Phương trình đường thẳng trong mặt phẳng tọa độ','HÌNH HỌC TỌA ĐỘ','↗','Viết phương trình đường thẳng qua điểm, có vectơ chỉ phương/pháp tuyến, xét vị trí tương đối và khoảng cách.',
      ['Dạng tổng quát: ax+by+c=0 (a,b không đồng thời bằng 0).','Vectơ pháp tuyến n⃗=(a;b); vectơ chỉ phương u⃗=(−b;a).','Qua M₀(x₀;y₀), có pháp tuyến (a;b): a(x−x₀)+b(y−y₀)=0.','Khoảng cách từ M(x₀;y₀) đến Δ: d=|ax₀+by₀+c|/√(a²+b²).','Hai đường thẳng song song khi các hệ số a,b tỉ lệ; vuông góc khi a₁a₂+b₁b₂=0.'],[
      F('Viết phương trình qua điểm và vectơ pháp tuyến','Đề cho điểm M₀ và pháp tuyến n⃗.',['Thay n⃗=(a;b) vào a(x−x₀)+b(y−y₀)=0.','Khai triển và thu về ax+by+c=0.'],'Viết đường thẳng qua M(1;2), có pháp tuyến n⃗=(1;2).',['1(x−1)+2(y−2)=0.','Khai triển x−1+2y−4=0.'],'x+2y−5=0.','Lấy vectơ chỉ phương thay cho pháp tuyến; quên dùng tọa độ điểm.','Cơ bản',''),
      F('Viết phương trình qua hai điểm','Đề cho A,B phân biệt và yêu cầu phương trình AB.',['Tính vectơ chỉ phương AB⃗=(xB−xA;yB−yA).','Chọn pháp tuyến vuông góc, ví dụ n⃗=(yB−yA;−(xB−xA)).','Dùng một điểm để viết phương trình.'],'Viết đường thẳng qua A(1;2), B(3;6).',['AB⃗=(2;4), có thể chọn pháp tuyến (2;−1).','2(x−1)−(y−2)=0.'],'2x−y=0.','Chọn pháp tuyến cùng phương với AB⃗; không kiểm tra hai điểm có thỏa mãn.','Vận dụng',''),
      F('Xét song song, vuông góc, trùng nhau','Đề hỏi vị trí tương đối của hai đường thẳng.',['So sánh vectơ pháp tuyến hoặc hệ số góc.','Pháp tuyến cùng phương: hai đường song song hoặc trùng nhau.','Thay một điểm để phân biệt song song và trùng.','Tích vô hướng hai pháp tuyến bằng 0 là điều kiện vuông góc.'],'Xét d₁:y=2x+1 và d₂:y=2x−3.',['Hai đường có cùng hệ số góc 2.','Tung độ gốc khác nhau nên không trùng.'],'d₁ song song d₂.','Chỉ thấy hệ số góc bằng nhau rồi kết luận trùng nhau.','Cơ bản',''),
      F('Tính khoảng cách từ điểm đến đường thẳng','Đề cho M(x₀;y₀), Δ:ax+by+c=0.',['Đưa đường thẳng về dạng tổng quát.','Thay tọa độ M vào tử số, lấy giá trị tuyệt đối.','Chia cho √(a²+b²).'],'Tính d từ M(1;2) đến 3x+4y−10=0.',['Tử số=|3+8−10|=1.','Mẫu số=√(9+16)=5.'],'d=1/5.','Quên trị tuyệt đối; không chia cho độ dài pháp tuyến.','Vận dụng',''),
      F('Giao điểm hai đường thẳng','Đề yêu cầu tìm giao điểm hoặc giải hệ phương trình hai ẩn.',['Lập hệ từ hai phương trình.','Giải bằng thế hoặc cộng đại số.','Kiểm tra nghiệm thỏa cả hai phương trình.'],'Tìm giao điểm y=x+1 và y=−x+5.',['x+1=−x+5 ⇒ 2x=4 ⇒ x=2.','y=2+1=3.'],'Giao điểm (2;3).','Chỉ tìm x mà quên y; giải hệ sai dấu.','Cơ bản','')
    ],['Phân biệt vectơ pháp tuyến và chỉ phương.','Đưa về dạng tổng quát trước khi dùng công thức.','Khoảng cách luôn không âm.']),

    T('circle','Đường tròn trong mặt phẳng tọa độ','HÌNH HỌC TỌA ĐỘ','◯','Nhận dạng phương trình đường tròn, xác định tâm bán kính và xét quan hệ với đường thẳng.',
      ['(x−a)²+(y−b)²=R² có tâm I(a;b), bán kính R.','x²+y²+Ax+By+C=0 có tâm I(−A/2;−B/2).','R²=(A²+B²)/4−C; cần R²>0 để là đường tròn thực.','Vị trí đường thẳng với đường tròn xét d(I,Δ) so với R.'],[
      F('Viết phương trình khi biết tâm và bán kính','Đề cho tâm I(a;b), bán kính R.',['Thay a,b,R vào dạng chuẩn.','Khai triển nếu đề yêu cầu dạng tổng quát.'],'Viết đường tròn tâm I(2;−1), bán kính 3.',['Dùng (x−a)²+(y−b)²=R².','Thay a=2,b=−1,R=3.'],'(x−2)²+(y+1)²=9.','Đổi sai dấu trong ngoặc; dùng R thay cho R².','Cơ bản',''),
      F('Tìm tâm và bán kính từ dạng tổng quát','Đề cho x²+y²+Ax+By+C=0.',['Nhóm x và y.','Hoàn thành bình phương từng nhóm.','Đọc tâm và bán kính.'],'Tìm tâm bán kính x²+y²−4x+6y+4=0.',['(x²−4x)+(y²+6y)+4=0.','(x−2)²−4+(y+3)²−9+4=0.','(x−2)²+(y+3)²=9.'],'I(2;−3), R=3.','Sai dấu tâm; quên cộng bù khi hoàn thành bình phương.','Vận dụng',''),
      F('Xét vị trí tương đối đường thẳng và đường tròn','Đề hỏi cắt, tiếp xúc hay không giao.',['Tìm tâm I và bán kính R.','Tính d(I,Δ).','d<R: cắt hai điểm; d=R: tiếp xúc; d>R: không giao.'],'Đường tròn x²+y²=4 và đường thẳng y=0 có vị trí thế nào?',['Tâm O(0;0), R=2.','Khoảng cách từ O đến y=0 là 0.','0<R nên đường thẳng cắt đường tròn tại hai điểm.'],'Cắt tại (−2;0) và (2;0).','Dùng khoảng cách từ một điểm bất kỳ; nhầm d=R là cắt hai điểm.','Vận dụng',''),
      F('Viết phương trình đường tròn có đường kính AB','Đề cho hai đầu mút đường kính.',['Tâm là trung điểm AB.','Bán kính bằng AB/2.','Thay tâm và bán kính vào dạng chuẩn.'],'A(0;0), B(4;0) là hai đầu đường kính.',['Tâm I(2;0).','AB=4 nên R=2.'],'(x−2)²+y²=4.','Lấy một đầu mút làm tâm; dùng AB làm bán kính.','Vận dụng','')
    ],['Hoàn thành bình phương cẩn thận.','Bán kính là căn của R².','Dùng khoảng cách từ tâm đến đường thẳng.']),

    T('conics','Ba đường conic: parabol, elip, hypebol','CHUYÊN ĐỀ MỞ RỘNG','◎','Nhận dạng phương trình chính tắc, xác định tiêu điểm, đỉnh, trục và các yếu tố đặc trưng.',
      ['Parabol: y²=2px (p>0), tiêu điểm F(p/2;0), đường chuẩn x=−p/2 (theo quy ước dạng này).','Elip: x²/a²+y²/b²=1 (a>b>0), c²=a²−b²; tiêu điểm (±c;0).','Hypebol: x²/a²−y²/b²=1, c²=a²+b²; tiêu điểm (±c;0).','Nếu trục lớn/trục thực nằm trên Oy, hoán đổi vai trò x và y.'],[
      F('Nhận dạng parabol và tìm tiêu điểm','Phương trình có một biến bình phương, biến kia bậc nhất.',['Đưa về dạng y²=2px hoặc x²=2py theo quy ước bài học.','Đối chiếu hệ số để tìm p.','Xác định đỉnh, trục, tiêu điểm và đường chuẩn.'],'Cho y²=8x. Tìm tiêu điểm theo dạng y²=2px.',['2p=8 ⇒ p=4.','F(p/2;0)=(2;0).'],'Đỉnh O(0;0), tiêu điểm F(2;0), đường chuẩn x=−2.','Nhầm y²=2px với y²=4px; cần kiểm tra quy ước p trong SGK đang dùng.','Vận dụng',''),
      F('Tìm các yếu tố của elip','Có dạng x²/a²+y²/b²=1 với a>b>0.',['Đọc a²,b² và lấy căn dương.','Tính c=√(a²−b²).','Tiêu điểm trên trục lớn Ox: (±c;0); các đỉnh trên hai trục.'],'Cho x²/25+y²/9=1. Tìm tiêu điểm.',['a=5,b=3.','c=√(25−9)=4.'],'F₁(−4;0), F₂(4;0).','Dùng a²+b²; đặt tiêu điểm trên trục nhỏ.','Cơ bản','c²=a²−b²'),
      F('Tìm các yếu tố của hypebol','Có dạng x²/a²−y²/b²=1 hoặc dạng hoán vị.',['Đọc a²,b².','Tính c=√(a²+b²).','Xác định trục thực và tọa độ tiêu điểm.'],'Cho x²/16−y²/9=1. Tìm tiêu điểm.',['a=4,b=3.','c=√(16+9)=5.'],'F₁(−5;0), F₂(5;0).','Dùng a²−b² giống elip; nhầm trục thực với trục ảo.','Vận dụng','c²=a²+b²'),
      F('Phân biệt và phác họa ba đường conic','Đề yêu cầu nhận dạng từ phương trình hoặc chọn đồ thị đúng.',['Quan sát số biến có bình phương và dấu giữa hai hạng tử.','Một biến bình phương: parabol.','Hai bình phương cùng dấu: elip (nếu chuẩn hóa tổng bằng 1).','Hai bình phương trái dấu: hypebol.'],'Phân loại x²/9+y²/4=1; x²/9−y²/4=1; y²=4x.',['Biểu thức thứ nhất có hai bình phương cùng dấu: elip.','Biểu thức thứ hai có hai bình phương trái dấu: hypebol.','Biểu thức thứ ba chỉ có y bình phương: parabol.'],'Theo thứ tự: elip, hypebol, parabol.','Chỉ dựa vào hệ số mà không đưa về dạng chuẩn; nhầm đường tròn (a=b) với elip tổng quát.','Cơ bản','')
    ],['Đọc kỹ quy ước tham số p ở dạng parabol.','Elip dùng hiệu a²−b²; hypebol dùng tổng a²+b².','Xác định trục lớn/trục thực trước khi ghi tiêu điểm.']),


    T('induction','Phương pháp quy nạp toán học (chuyên đề lựa chọn)','CHUYÊN ĐỀ MỞ RỘNG','∑','Dùng quy nạp toán học để chứng minh mệnh đề đúng với mọi số tự nhiên từ một mốc xác định.',
      ['Bước 1: kiểm tra mệnh đề tại n=n₀.','Bước 2: giả sử mệnh đề đúng tại n=k (giả thiết quy nạp).','Bước 3: dùng giả thiết đó chứng minh mệnh đề đúng tại n=k+1.','Kết luận mệnh đề đúng với mọi n≥n₀.'],[
      F('Chứng minh đẳng thức tổng bằng quy nạp','Đề có tổng theo n và yêu cầu chứng minh đúng với mọi n tự nhiên.',['Kiểm tra trường hợp đầu n=n₀.','Giả sử công thức đúng với n=k.','Xét biểu thức ở n=k+1, tách phần hạng tử cuối.','Thay giả thiết quy nạp và biến đổi về công thức cần chứng minh.'],'Chứng minh 1+2+…+n=n(n+1)/2 với n≥1.',['n=1: vế trái=1, vế phải=1 nên đúng.','Giả sử 1+…+k=k(k+1)/2.','Khi n=k+1: 1+…+k+(k+1)=k(k+1)/2+(k+1).','=(k+1)(k/2+1)=(k+1)(k+2)/2.'],'Mệnh đề đúng với mọi n≥1 theo nguyên lý quy nạp.','Chỉ chứng minh bước k⇒k+1 mà quên bước cơ sở; dùng điều cần chứng minh như giả thiết.','Vận dụng','P(n₀), P(k)⇒P(k+1) ⟹ P(n) đúng ∀n≥n₀.'),
      F('Chứng minh bất đẳng thức bằng quy nạp','Mệnh đề là bất đẳng thức phụ thuộc n.',['Kiểm tra bất đẳng thức tại mốc đầu.','Giả sử bất đẳng thức đúng với n=k.','Biến đổi biểu thức ở k+1, kết hợp giả thiết và các bất đẳng thức hiển nhiên.','Kết luận theo quy nạp.'],'Chứng minh 2ⁿ≥n+1 với n≥0.',['n=0: 1≥1 đúng.','Giả sử 2ᵏ≥k+1.','2ᵏ⁺¹=2·2ᵏ≥2(k+1)≥k+2 với k≥0.'],'2ⁿ≥n+1 đúng với mọi n≥0.','Không chỉ ra vì sao 2(k+1)≥k+2; quên miền k≥0.','Nâng cao',''),
      F('Tìm lỗi trong một chứng minh quy nạp','Đề đưa lời giải mẫu và yêu cầu chỉ ra bước sai.',['Kiểm tra mốc cơ sở có thực sự thỏa mệnh đề không.','Kiểm tra giả thiết quy nạp có đúng phạm vi không.','Kiểm tra bước chuyển có dùng giả thiết hợp lệ và suy ra đúng kết luận không.'],'Một bạn chứng minh “mọi số tự nhiên đều bằng nhau” bằng cách nói: nếu k số đầu bằng nhau thì k+1 số đầu cũng bằng nhau. Lỗi nằm ở đâu?',['Một chứng minh quy nạp phải có bước cơ sở.','Bước chuyển từ tập k phần tử sang k+1 phần tử cần có phần tử chung để nối hai nhóm.','Với k=1, hai nhóm {a₁,…,aₖ} và {a₂,…,aₖ₊₁} không có phần tử chung khi k=1.'],'Bước chuyển không đúng ở trường hợp k=1; thiếu lập luận hợp lệ để nối hai nhóm.','Chấp nhận bước quy nạp chỉ vì hình thức giống mẫu; không kiểm tra trường hợp biên.','Nâng cao','')
    ],['Không được bỏ bước cơ sở.','Giả thiết quy nạp chỉ đúng tại n=k, không phải mọi n.','Bước chuyển phải chứng minh đầy đủ.']),

    T('three-vars','Hệ phương trình bậc nhất ba ẩn (chuyên đề lựa chọn)','CHUYÊN ĐỀ MỞ RỘNG','⧉','Nội dung mở rộng/lựa chọn: mô hình hóa và giải hệ ba phương trình bậc nhất ba ẩn.',

      F('Giải hệ bằng phép khử','Hệ ba phương trình ba ẩn.',['Chọn cặp phương trình để khử cùng một ẩn.','Lặp lại để đưa về hệ hai ẩn.','Giải hệ hai ẩn rồi thế ngược tìm ẩn còn lại.','Kiểm tra cả ba phương trình.'],'Giải hệ: x+y+z=6; x−y=0; z=2.',['Từ x−y=0 suy ra x=y.','Thay z=2 vào phương trình đầu: x+y=4.','Kết hợp x=y suy ra x=y=2.'],'(x;y;z)=(2;2;2).','Khử ẩn không nhân đồng nhất hệ số; không thế ngược để tìm đủ ẩn.','Vận dụng',''),
      F('Lập hệ ba ẩn từ bài toán thực tế','Bài toán có ba đại lượng chưa biết và ba quan hệ tuyến tính.',['Đặt ba ẩn, ghi rõ đơn vị.','Chuyển từng dữ kiện thành một phương trình.','Giải hệ và diễn giải nghiệm.'],'Ba loại vé A,B,C có giá lần lượt x,y,z. Biết x+y+z=60; x−y=10; z=20. Tìm x,y,z.',['Từ z=20 suy ra x+y=40.','x−y=10.','Cộng hai phương trình: 2x=50 ⇒ x=25; y=15.'],'(x;y;z)=(25;15;20).','Lập phương trình không nhất quán đơn vị; gán ẩn không rõ ý nghĩa.','Vận dụng','')
    ],['Đây là chuyên đề lựa chọn, không phải mọi lớp đều học cùng thời lượng.','Đặt ẩn và đơn vị trước khi lập hệ.','Kiểm tra nghiệm trong ngữ cảnh thực tế.'])

    {id:'q19',topic:'vectors',difficulty:'Cơ bản',q:'Nếu AB⃗+BC⃗ thì bằng:',o:['AC⃗','CA⃗','BA⃗','CB⃗'],a:0,e:'Quy tắc ba điểm: AB⃗+BC⃗=AC⃗.'},
    {id:'q20',topic:'vectors',difficulty:'Cơ bản',q:'u⃗=(2;−1), v⃗=(1;2). Tích vô hướng bằng:',o:['4','2','0','−2'],a:2,e:'2·1+(−1)·2=0, do đó hai vectơ vuông góc.'},
    {id:'q21',topic:'coordinate-vector',difficulty:'Cơ bản',q:'A(1;2), B(4;6). Tọa độ AB⃗ là:',o:['(5;8)','(3;4)','(−3;−4)','(4;6)'],a:1,e:'AB⃗=(xB−xA;yB−yA)=(3;4).'},
    {id:'q22',topic:'coordinate-vector',difficulty:'Cơ bản',q:'Trung điểm của A(1;2), B(5;4) là:',o:['(6;6)','(2;3)','(3;3)','(4;2)'],a:2,e:'M=((1+5)/2;(2+4)/2)=(3;3).'},
    {id:'q23',topic:'statistics-center',difficulty:'Cơ bản',q:'Số trung bình của 5,7,8,10 là:',o:['7','7,5','8','30'],a:1,e:'(5+7+8+10)/4=7,5.'},
    {id:'q24',topic:'statistics-center',difficulty:'Cơ bản',q:'Trung vị của dãy 2,9,4,6,10 là:',o:['4','5','6','9'],a:2,e:'Sắp xếp 2,4,6,9,10; giá trị ở giữa là 6.'},
    {id:'q25',topic:'statistics-center',difficulty:'Cơ bản',q:'Mốt của 2,3,3,4,4,4,5 là:',o:['3','4','5','2'],a:1,e:'4 xuất hiện 3 lần, nhiều nhất.'},
    {id:'q26',topic:'statistics-spread',difficulty:'Cơ bản',q:'Khoảng biến thiên của 3,5,8,10 là:',o:['5','7','8','13'],a:1,e:'R=max−min=10−3=7.'},
    {id:'q27',topic:'statistics-spread',difficulty:'Vận dụng',q:'Nếu Q₁=2,5 và Q₃=7,5 thì khoảng tứ phân vị là:',o:['10','5','2,5','−5'],a:1,e:'ΔQ=Q₃−Q₁=7,5−2,5=5.'},
    {id:'q28',topic:'counting',difficulty:'Cơ bản',q:'Có 3 áo và 2 quần. Số bộ gồm 1 áo, 1 quần là:',o:['5','6','8','9'],a:1,e:'Quy tắc nhân: 3·2=6.'},
    {id:'q29',topic:'counting',difficulty:'Cơ bản',q:'Số cách xếp 5 học sinh thành một hàng là:',o:['25','60','120','10'],a:2,e:'Hoán vị 5 phần tử: 5!=120.'},
    {id:'q30',topic:'counting',difficulty:'Vận dụng',q:'Chọn 2 bạn từ 5 bạn, không phân biệt thứ tự, có:',o:['10','20','25','5'],a:0,e:'C₅²=5!/(2!3!)=10.'},
    {id:'q31',topic:'binomial',difficulty:'Cơ bản',q:'Khai triển (x+2)³ là:',o:['x³+8','x³+6x²+12x+8','x³+2x²+4x+8','x³+6x+8'],a:1,e:'Theo nhị thức Newton: x³+3x²·2+3x·4+8.'},
    {id:'q32',topic:'binomial',difficulty:'Vận dụng',q:'Hệ số của x² trong (2x−1)⁴ là:',o:['−24','−16','24','32'],a:2,e:'Số hạng x² ứng với k=2: C₄²(2x)²(−1)², hệ số 6·4=24.'},
    {id:'q33',topic:'probability',difficulty:'Cơ bản',q:'Gieo một xúc xắc cân đối, xác suất ra số chẵn là:',o:['1/6','1/3','1/2','2/3'],a:2,e:'Có 3 kết quả thuận lợi trong 6 kết quả đồng khả năng: 3/6=1/2.'},
    {id:'q34',topic:'probability',difficulty:'Cơ bản',q:'Tung đồng xu hai lần. Xác suất có đúng một lần ngửa là:',o:['1/4','1/2','3/4','1'],a:1,e:'Ω={SS,SN,NS,NN}; thuận lợi SN,NS nên P=2/4=1/2.'},
    {id:'q35',topic:'probability',difficulty:'Vận dụng',q:'Nếu P(A)=0,3 thì P(Ā) bằng:',o:['0,3','0,7','1,3','0'],a:1,e:'P(Ā)=1−P(A)=0,7.'},
    {id:'q36',topic:'line',difficulty:'Cơ bản',q:'Đường thẳng qua M(1;2), pháp tuyến (1;2) có phương trình:',o:['x−2y+3=0','x+2y−5=0','2x+y−4=0','x+y−3=0'],a:1,e:'(x−1)+2(y−2)=0 ⇒ x+2y−5=0.'},
    {id:'q37',topic:'line',difficulty:'Cơ bản',q:'Khoảng cách từ M(1;2) đến 3x+4y−10=0 là:',o:['1','1/5','5','0'],a:1,e:'d=|3+8−10|/√(9+16)=1/5.'},
    {id:'q38',topic:'line',difficulty:'Vận dụng',q:'Hai đường y=2x+1 và y=2x−3 là:',o:['Cắt nhau','Trùng nhau','Song song phân biệt','Vuông góc'],a:2,e:'Cùng hệ số góc 2 nhưng tung độ gốc khác nhau nên song song phân biệt.'},
    {id:'q39',topic:'circle',difficulty:'Cơ bản',q:'Đường tròn tâm I(2;−1), bán kính 3 có phương trình:',o:['(x+2)²+(y−1)²=3','(x−2)²+(y+1)²=9','(x−2)²+(y+1)²=3','(x+2)²+(y−1)²=9'],a:1,e:'Dạng chuẩn (x−a)²+(y−b)²=R².'},
    {id:'q40',topic:'circle',difficulty:'Vận dụng',q:'Tâm của x²+y²−4x+6y+4=0 là:',o:['(−2;3)','(2;−3)','(4;−6)','(2;3)'],a:1,e:'Tâm I(−A/2;−B/2)=(2;−3).'},
    {id:'q41',topic:'conics',difficulty:'Cơ bản',q:'Với elip x²/25+y²/9=1, tiêu cự c bằng:',o:['2','3','4','5'],a:2,e:'c²=a²−b²=25−9=16 ⇒ c=4.'},
    {id:'q42',topic:'conics',difficulty:'Cơ bản',q:'Với hypebol x²/16−y²/9=1, c bằng:',o:['3','4','5','7'],a:2,e:'c²=a²+b²=16+9=25 ⇒ c=5.'},
    {id:'q43',topic:'conics',difficulty:'Vận dụng',q:'Đồ thị y²=8x có tiêu điểm theo dạng y²=2px là:',o:['(1;0)','(2;0)','(4;0)','(0;2)'],a:1,e:'2p=8 ⇒ p=4; tiêu điểm F(p/2;0)=(2;0).'},
    {id:'q44',topic:'three-vars',difficulty:'Vận dụng',q:'Hệ x+y+z=6, x−y=0, z=2 có nghiệm:',o:['(1;3;2)','(2;2;2)','(3;1;2)','(2;1;3)'],a:1,e:'z=2; x=y; x+y=4 nên x=y=2.'},
    {id:'q45',topic:'statistics-data',difficulty:'Cơ bản',q:'Một giá trị xuất hiện 8 lần trong mẫu 40 quan sát. Tần suất của giá trị đó là:',o:['8%','20%','32%','5%'],a:1,e:'f=8/40=0,2=20%.'},
    {id:'q46',topic:'statistics-data',difficulty:'Cơ bản',q:'Giá trị đúng 12,5 cm, số đo gần đúng 12,4 cm. Sai số tuyệt đối là:',o:['0,1 cm','0,9 cm','1 cm','24,9 cm'],a:0,e:'Δa=|12,4−12,5|=0,1 cm.'},
    {id:'q47',topic:'statistics-data',difficulty:'Cơ bản',q:'Làm tròn 3,746 đến hàng phần trăm được:',o:['3,74','3,75','3,7','3,8'],a:1,e:'Chữ số hàng phần nghìn là 6 nên tăng hàng phần trăm từ 4 lên 5.'},
    {id:'q48',topic:'induction',difficulty:'Vận dụng',q:'Bước đầu tiên trong chứng minh quy nạp là:',o:['Giả sử P(k) đúng','Chứng minh P(k+1)','Kiểm tra mệnh đề tại n₀','Kết luận ngay'],a:2,e:'Quy nạp cần bước cơ sở P(n₀), sau đó mới đến bước giả sử P(k) và chứng minh P(k+1).'},
    {id:'q49',topic:'induction',difficulty:'Vận dụng',q:'Nếu P(k) đã được giả sử đúng, bước quy nạp cần chứng minh:',o:['P(k−1)','P(k+1)','P(n₀−1)','¬P(k)'],a:1,e:'Bước chuyển là từ P(k) suy ra P(k+1).'},
    {id:'q50',topic:'logic',difficulty:'Vận dụng',q:'Mệnh đề đảo của “Nếu n chia hết cho 4 thì n chẵn” là:',o:['Nếu n chẵn thì n chia hết cho 4','Nếu n lẻ thì n chia hết cho 4','Nếu n chia hết cho 2 thì n chẵn','Nếu n không chẵn thì n không chia hết cho 4'],a:0,e:'Đảo P⇒Q là Q⇒P. Mệnh đề đảo này không luôn đúng, ví dụ n=2.'}
  ];
})();

</script>
<script>
/* AI Mentor Toán 10 — front-end application logic. */
(() => {
  'use strict';
  const $ = (s, root=document) => root.querySelector(s);
  const $$ = (s, root=document) => [...root.querySelectorAll(s)];
  const topics = window.MATH_LIBRARY || [];
  const bank = window.QUESTION_BANK || [];
  const totalForms = topics.reduce((n,t)=>n+t.types.length,0);
  const topicById = id => topics.find(t=>t.id===id);
  const safe = value => String(value ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const stateKey = 'aiMentorToan10Ultimate_v1';
  const initial = {saved:[],completed:[],attempts:{},history:[]};
  let state = loadState();
  let selectedTopic = null;
  let currentForm = null;
  let quiz = null;
  let quizStartedAt = 0;
  let currentQuizResult = null;

  function loadState(){
    try { const parsed=JSON.parse(localStorage.getItem(stateKey)||'{}'); return {...initial,...parsed,saved:Array.isArray(parsed.saved)?parsed.saved:[],completed:Array.isArray(parsed.completed)?parsed.completed:[],attempts:parsed.attempts||{},history:Array.isArray(parsed.history)?parsed.history:[]}; }
    catch { return structuredClone(initial); }
  }
  function saveState(){ try { localStorage.setItem(stateKey,JSON.stringify(state)); } catch(e){ toast('Không thể lưu dữ liệu trên trình duyệt này.'); } }
  function toast(msg){ const n=$('#toast'); n.textContent=msg; n.classList.add('show'); clearTimeout(toast.timer); toast.timer=setTimeout(()=>n.classList.remove('show'),2400); }
  function goPage(id){
    $$('.page').forEach(p=>p.classList.toggle('active',p.id===`page-${id}`));
    $$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===id));
    const labels={home:'Tổng quan',library:'Thư viện dạng toán',tutor:'Gia sư học tập',practice:'Luyện tập thông minh',exam2026:'Thi thử theo đề 2026',formulas:'Cẩm nang công thức',progress:'Hồ sơ tiến độ'};
    $('#crumbText').textContent=labels[id]||'Tổng quan';
    $('#sidebar').classList.remove('open');
    if(id==='home')renderHome(); if(id==='library')renderLibrary(); if(id==='formulas')renderFormulas(); if(id==='progress')renderProgress(); if(id==='tutor')renderSavedTutor();
    window.scrollTo({top:0,behavior:'smooth'});
  }
  function topicStats(id){ const a=state.attempts[id]||{total:0,correct:0}; return {...a,accuracy:a.total?Math.round(a.correct/a.total*100):0}; }
  function totalAttempts(){return Object.values(state.attempts).reduce((n,a)=>n+(a.total||0),0);}
  function totalCorrect(){return Object.values(state.attempts).reduce((n,a)=>n+(a.correct||0),0);}
  function accuracy(){const n=totalAttempts();return n?Math.round(totalCorrect()/n*100):null;}
  function formKey(tid,index){return `${tid}:${index}`;}
  function renderHome(){
    $('#statForms').textContent=totalForms; $('#statSolved').textContent=totalAttempts(); $('#statAccuracy').textContent=accuracy()===null?'—':accuracy()+'%'; $('#statSaved').textContent=state.saved.length;
    $('#formCount').textContent=totalForms;
    $('#homeTopicProgress').innerHTML=topics.filter(t=>!t.group.includes('MỞ RỘNG')).slice(0,8).map(t=>{
      const s=topicStats(t.id); const pct=s.total?s.accuracy:0;
      return `<div class="progress-row"><div class="progress-ico">${safe(t.icon)}</div><div><div class="progress-meta"><b>${safe(t.title)}</b><span>${s.total} câu đã làm</span></div><div class="bar"><i style="width:${pct}%"></i></div></div><div class="progress-pct">${s.total?pct+'%':'—'}</div></div>`;
    }).join('');
    const picks=['quadratic','quadratic-sign','triangle','vectors'];
    $('#recommendedTopics').innerHTML=picks.map(id=>topicCard(topicById(id))).join('');
  }
  function topicCard(t){if(!t)return'';const count=t.types.length; const pct=topicStats(t.id).accuracy;return `<article class="topic-card" data-topic="${safe(t.id)}"><div class="topic-card-top"><div class="topic-icon">${safe(t.icon)}</div><div><h3>${safe(t.title)}</h3><p>${safe(t.description)}</p></div></div><div class="topic-card-foot"><span>${count} dạng toán · ${safe(t.group)}</span><span>${topicStats(t.id).total?pct+'% chính xác':'Chưa luyện →'}</span></div></article>`;}
  function renderLibrary(){
    const q=($('#librarySearch')?.value||'').trim().toLowerCase(); const group=$('#groupFilter')?.value||'all'; const level=$('#levelFilter')?.value||'all';
    const content=$('#libraryContent'); if(!content)return;
    if(selectedTopic&&!q){
      const t=topicById(selectedTopic); if(!t){selectedTopic=null;return renderLibrary();}
      $('#libraryResultTitle').textContent=t.title; $('#libraryResultSub').textContent=t.description; $('#libraryCount').textContent=t.types.length+' dạng toán';
      const back=`<button class="btn ghost mini" id="backToTopics">← Tất cả chuyên đề</button>`;
      const formulas=`<div class="panel" style="margin:0 0 13px;background:#faf9ff"><div class="panel-title"><h2>📌 Công thức trọng tâm</h2><span class="pill">${t.formulas.length} công thức</span></div><div class="math-box">${t.formulas.map(safe).join('<br>')}</div></div>`;
      const check=t.checklist?.length?`<div class="panel" style="margin:0 0 13px"><div class="panel-title"><h2>Checklist trước khi làm bài</h2></div><ul style="margin:0;padding-left:18px;color:#666b84;font-size:10px;line-height:2">${t.checklist.map(x=>`<li>${safe(x)}</li>`).join('')}</ul></div>`:'';
      content.innerHTML=back+formulas+check+`<div class="form-list">${t.types.map((f,i)=>formRow(t,f,i)).join('')}</div>`;
      return;
    }
    selectedTopic=null;
    let forms=[];
    topics.filter(t=>group==='all'||t.group===group).forEach(t=>t.types.forEach((f,i)=>{
      const searchText=[t.title,t.description,t.group,f.name,f.recognize,f.formula,...t.formulas].join(' ').toLowerCase();
      if((!q||searchText.includes(q))&&(level==='all'||f.level===level))forms.push({t,f,i});
    }));
    if(q||level!=='all'||group!=='all'){
      $('#libraryResultTitle').textContent='Kết quả tìm kiếm'; $('#libraryResultSub').textContent=q?`Kết quả khớp với “${q}”.`:'Các dạng toán theo bộ lọc đã chọn.'; $('#libraryCount').textContent=forms.length+' dạng toán';
      content.innerHTML=forms.length?`<div class="form-list">${forms.map(({t,f,i})=>`<div class="form-row" data-form-topic="${t.id}" data-form-index="${i}"><div class="form-num">${safe(t.icon)}</div><div><strong>${safe(f.name)}</strong><small>${safe(t.title)} · ${safe(f.recognize)}</small></div><span class="level" data-level="${safe(f.level)}">${safe(f.level)}</span></div>`).join('')}</div>`:'<div class="empty"><b>⌕</b>Chưa tìm thấy dạng toán phù hợp. Thử từ khóa ngắn hơn nhé.</div>';
    } else {
      $('#libraryResultTitle').textContent='Tất cả chuyên đề'; $('#libraryResultSub').textContent=`${topics.length} chuyên đề · ${totalForms} dạng toán được hệ thống hóa.`; $('#libraryCount').textContent=totalForms+' dạng toán';
      content.innerHTML=`<div class="library-layout">${topics.map(topicCard).join('')}</div><p class="footnote" style="margin-top:14px">Mục “Chuyên đề mở rộng” có thể không nằm trong phần học bắt buộc của mọi lớp. Hãy đối chiếu kế hoạch dạy học và bộ sách đang sử dụng.</p>`;
    }
  }
  function formRow(t,f,i){const done=state.completed.includes(formKey(t.id,i));return `<div class="form-row" data-form-topic="${safe(t.id)}" data-form-index="${i}"><div class="form-num">${done?'✓':String(i+1).padStart(2,'0')}</div><div><strong>${safe(f.name)}</strong><small>${safe(f.recognize)}</small></div><span class="level" data-level="${safe(f.level)}">${safe(f.level)}</span></div>`;}
  function openForm(tid,index){const t=topicById(tid),f=t?.types[index];if(!t||!f)return;currentForm={tid,index};
    $('#modalEyebrow').textContent=`${t.group} · ${f.level}`;$('#modalTitle').textContent=f.name;$('#modalMeta').innerHTML=`<span class="pill">${safe(t.title)}</span>`;
    const done=state.completed.includes(formKey(tid,index)),saved=state.saved.includes(formKey(tid,index));
    $('#modalBody').innerHTML=`<div class="detail-grid"><div><div class="detail-block"><h3>🔎 Dấu hiệu nhận biết</h3><p>${safe(f.recognize)}</p></div><div class="detail-block"><h3>🧭 Quy trình giải</h3><ol>${f.method.map(x=>`<li>${safe(x)}</li>`).join('')}</ol></div><div class="detail-block"><h3>✍️ Ví dụ giải từng bước</h3><div class="example-box"><div class="question">${safe(f.example)}</div>${f.steps.map((s,i)=>`<div class="step"><b>${i+1}</b><span>${safe(s)}</span></div>`).join('')}<div class="math-box" style="margin-top:10px"><b>Kết luận:</b> ${safe(f.result)}</div></div></div><div class="detail-block"><h3>⚠️ Lỗi thường gặp</h3><div class="mistake">${safe(f.mistakes)}</div></div></div><div><div class="panel" style="padding:14px;background:#faf9ff"><div class="panel-title"><h2>Ghi nhớ nhanh</h2></div><div class="math-box">${safe(f.formula||t.formulas.slice(0,3).join('\n'))}</div><p class="footnote" style="margin-top:10px">Đọc kỹ điều kiện, ký hiệu và yêu cầu của đề trước khi áp dụng công thức.</p></div><div class="panel" style="padding:14px;margin-top:12px"><div class="panel-title"><h2>Tự đánh giá</h2></div><p class="footnote">Sau khi đọc ví dụ, thử tự giải một bài tương tự mà không nhìn lời giải.</p><button class="btn ${done?'soft':' '}" id="markDoneBtn" style="width:100%">${done?'✓ Đã đánh dấu đã học':'Đánh dấu đã học ✓'}</button><button class="btn ghost" id="saveFormBtn" style="width:100%;margin-top:8px">${saved?'★ Bỏ khỏi đã lưu':'☆ Lưu dạng toán'}</button><button class="btn ghost" id="practiceRelatedBtn" style="width:100%;margin-top:8px">Luyện câu hỏi chủ đề này →</button></div></div></div>`;
    $('#modalBackdrop').classList.add('show');
  }
  function closeModal(){$('#modalBackdrop').classList.remove('show');currentForm=null;}
  function markFormDone(){if(!currentForm)return;const k=formKey(currentForm.tid,currentForm.index);if(!state.completed.includes(k))state.completed.push(k);saveState();openForm(currentForm.tid,currentForm.index);toast('Đã cập nhật tiến độ học tập.');renderHome();}
  function toggleSaved(){if(!currentForm)return;const k=formKey(currentForm.tid,currentForm.index);if(state.saved.includes(k))state.saved=state.saved.filter(x=>x!==k);else state.saved.push(k);saveState();openForm(currentForm.tid,currentForm.index);renderHome();}
  function renderSavedTutor(){const root=$('#savedTutorForms');if(!root)return;const items=state.saved.map(k=>{const [id,n]=k.split(':');const t=topicById(id),f=t?.types[Number(n)];return t&&f?{t,f,i:Number(n)}:null;}).filter(Boolean);root.innerHTML=items.length?items.map(({t,f,i})=>`<div class="form-row" data-form-topic="${t.id}" data-form-index="${i}"><div class="form-num">★</div><div><strong>${safe(f.name)}</strong><small>${safe(t.title)}</small></div><span>→</span></div>`).join(''):'<div class="empty">Chưa lưu dạng toán nào.</div>';}

  function renderFormulas(){const q=($('#formulaSearch')?.value||'').toLowerCase().trim(),group=$('#formulaGroup')?.value||'all';let rows=[];topics.filter(t=>group==='all'||t.id===group).forEach(t=>t.formulas.forEach(f=>{if(!q||(`${t.title} ${f}`).toLowerCase().includes(q))rows.push({t,f});}));$('#formulaContent').innerHTML=rows.length?rows.map(({t,f})=>`<article class="formula-card"><h3>${safe(t.icon)} ${safe(t.title)}</h3><div class="formula-line">${safe(f)}</div><p>Gợi ý: mở chuyên đề để xem cách áp dụng công thức vào ví dụ cụ thể.</p><button class="btn ghost mini" data-topic="${t.id}" style="margin-top:10px">Mở chuyên đề →</button></article>`).join(''):'<div class="empty">Không tìm thấy công thức phù hợp.</div>';}
  function renderProgress(){
    $('#progressSolved').textContent=totalAttempts();$('#progressAccuracy').textContent=accuracy()===null?'—':accuracy()+'%';$('#progressSaved').textContent=state.saved.length;
    const attempted=topics.filter(t=>(state.attempts[t.id]?.total||0)>0).length;$('#progressTopics').textContent=`${attempted}/${topics.length}`;
    $('#progressByTopic').innerHTML=topics.map(t=>{const s=topicStats(t.id);return `<div class="progress-row"><div class="progress-ico">${safe(t.icon)}</div><div><div class="progress-meta"><b>${safe(t.title)}</b><span>${s.correct}/${s.total} câu đúng</span></div><div class="bar"><i style="width:${s.accuracy}%"></i></div></div><div class="progress-pct">${s.total?s.accuracy+'%':'—'}</div></div>`;}).join('');
    $('#historyList').innerHTML=state.history.length?state.history.slice().reverse().map(h=>`<div class="history-row"><div><b>${safe(h.label)}</b><div class="muted" style="margin-top:4px">${safe(h.date)} · ${h.total} câu</div></div><span class="pill ${h.pct>=70?'green':'amber'}">${h.score}/${h.total} · ${h.pct}%</span></div>`).join(''):'<div class="empty">Chưa có lượt luyện tập nào. Hãy làm một bài kiểm tra ngắn nhé.</div>';
  }

  function initSelectors(){
    $('#quizTopic').innerHTML='<option value="all">Tất cả chủ đề</option>'+topics.map(t=>`<option value="${t.id}">${safe(t.title)}</option>`).join('');
    $('#formulaGroup').innerHTML='<option value="all">Tất cả chuyên đề</option>'+topics.map(t=>`<option value="${t.id}">${safe(t.title)}</option>`).join('');
  }
  function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function startQuiz(){
    const topic=$('#quizTopic').value,level=$('#quizLevel').value,count=Number($('#quizCount').value);
    let pool=bank.filter(q=>(topic==='all'||q.topic===topic)&&(level==='all'||q.difficulty===level));
    if(!pool.length){toast('Chưa có câu hỏi đúng bộ lọc này. Hãy chọn chủ đề khác.');return;}
    quiz=shuffle(pool).slice(0,Math.min(count,pool.length)).map(q=>({...q}));quiz.answers=Array(quiz.length).fill(null);quiz.index=0;quizStartedAt=Date.now();

  }
  function renderQuestion(){if(!quiz)return;const q=quiz[quiz.index],t=topicById(q.topic);$('#quizTopicLabel').textContent=t?.title||'TOÁN 10';$('#quizDifficulty').textContent=q.difficulty;$('#quizPosition').textContent=`Câu ${quiz.index+1}/${quiz.length}`;$('#quizProgressBar').style.width=((quiz.index+1)/quiz.length*100)+'%';$('#quizQuestion').textContent=q.q;
    $('#quizOptions').innerHTML=q.o.map((o,i)=>`<div class="option ${quiz.answers[quiz.index]===i?'selected':''}" data-answer="${i}"><span class="letter">${'ABCD'[i]}</span><span>${safe(o)}</span></div>`).join('');
    $('#prevQuestion').disabled=quiz.index===0;$('#nextQuestion').classList.toggle('hidden',quiz.index===quiz.length-1);$('#submitQuiz').classList.toggle('hidden',quiz.index!==quiz.length-1);
